# CI for the public mirror.
#
# The mirror is read-only and pull requests are not merged here (CONTRIBUTING.md),
# so this workflow is not the merge gate that decides what ships — the private
# source repository runs the same two jobs and gates there. This runs anyway,
# on every mirrored commit and on any pull request someone opens, because a
# public repository whose CI status is unknown is not evidence of anything, and
# because a reader deciding whether to install this package can see it pass.
#
# Both jobs are required status checks on the default branch, so a pull request
# cannot be merged while either is red (TJP-664 AC6).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Catch a dependency advisory that lands after a release, not only at merge.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Unit suite
        # The live tests need a running service and a credential; they skip
        # themselves when DSAIL_TEST_URL is unset, which is the case here.
        run: python -m unittest discover -s test -t . -v
      - name: The install carries no parser, compiler or solver
        # The claim the README makes in its first screen, asserted rather than
        # trusted. If a solver ever ships in this wheel, this is what says so.
        run: |
          python - <<'PY'
          import importlib.util, sys
          for name in ("z3", "antlr4", "common", "agent_api", "certasphere_common"):
              if importlib.util.find_spec(name) is not None:
                  sys.exit("FAIL: %s is importable from the installed environment" % name)
          import dsail, dsail.contract
          assert dsail.contract.tools()["tools"], "bundled tools missing"
          print("OK: no parser, compiler or solver; contract bundle present")
          PY

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit==2.9.0" "bandit==1.8.6" "build==1.6.0" "twine==7.0.0"
      - name: Dependency audit
        # The runtime dependency set is one direct package (`mcp`) and its
        # closure; this is cheap and it is the half of the supply chain we do
        # not compile ourselves.
        #
        # Audit the closure, not this package. `pip-audit` resolves every
        # installed distribution against PyPI's advisory feed, and under
        # --strict a distribution it cannot find is an error rather than a
        # warning. `dsail` built from this checkout is exactly that: the
        # version here is normally ahead of the published one, and before the
        # first release there is nothing published to match at all. Auditing
        # our own package against an advisory feed would tell us nothing in any
        # case -- an advisory about `dsail` would reach us long before PyPI.
        run: |
          pip install .
          pip freeze --exclude dsail --exclude-editable > /tmp/closure.txt
          echo "auditing $(wc -l < /tmp/closure.txt) dependencies:"
          cat /tmp/closure.txt
          pip-audit --strict --progress-spinner off -r /tmp/closure.txt
      - name: Static analysis
        run: bandit -r src/dsail -ll
      - name: Build and check the distribution
        run: |
          python -m build --sdist --wheel .
          twine check --strict dist/*
      - name: No credential in the tree
        # A backstop, not the gate. The authoritative scan runs in the private
        # source repository over every revision of the published subtree, which
        # is the only place that question can actually be answered -- this
        # repository's history is squashed by construction and a clone of it
        # cannot show what an old revision upstream contained.
        #
        # .github/workflows is excluded because this file carries the patterns
        # as literal text in order to search for them, and a detector that
        # matches itself reports a finding on every run, which trains everyone
        # to ignore it. The exclusion is one directory wide and stated, rather
        # than a pattern quietly weakened until it stops matching.
        run: |
          set +e
          hits=$(grep -rEn \
            'pypi-AgEIcHlwaS5vcmc|gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' \
            --exclude-dir=.git --exclude-dir=dist --exclude-dir=workflows . )
          if [ -n "$hits" ]; then echo "$hits"; echo "credential-shaped string in the tree"; exit 1; fi
          echo "clean"
