<!--
  The DSAIL review UI (TJP-636). NOT a document: a fragment, fetched over
  the connector by widget-shell.html and injected into it, so a deployed
  change to this file reaches every connected user on their next
  conversation with no disconnect/reconnect. `8e1d1c0535` is substituted
  by agent_api.widget with this file's own content hash.

  Four tools render here, each recognised by the shape of its own payload
  rather than by a tool name the result does not carry: a listing has
  `rulesets`, one ruleset has a hash and a manifest (TJP-634), and a check
  result has `rules` with no manifest. A check result's ruleset context (its
  source and manifest, and the claim values the check was sent) rides in the
  result's `_meta["dsail/check"]`, which reaches this frame and not the model.

  The layout is a fixed-height frame: a header, two tabs (Rules and Source,
  plus Units when the ruleset uses units), one scrolling body and a footer
  pinned to the bottom that carries the check and edit lifecycle. The frame
  never grows with its content, so the header, the tabs and the primary
  actions stay reachable however long the ruleset is.

  Each rule is developed in one place: what it says (the comment block above
  its assert), its own result, the claims it reads with a Yes / No / Unknown
  control each, and its DSAIL source. Unknown is an answer like Yes and No,
  never "unset". Every rule shows its own result — TRUE, FALSE, UNKNOWN or
  AMBIGUOUS — and nothing else: there is no overall verdict to render. The
  service publishes none, and inventing one here would put a decision on
  screen that nothing behind it made (TJP-635).

  One draft of the source. Prose, claim questions and context, a rule's
  source and the Source tab all edit the same text, and every view reads it.
  Committing calls dsail_compile with the current hash as the parent, and the
  whole widget re-hydrates from that result. The Source tab is a
  line-numbered editor — a transparent textarea over the highlighted lines —
  because the compiler's diagnostics name line numbers.

  One widget for every chat surface (TJP-620). Whether a control may call a
  tool itself is a fact about the HOST, learned at runtime from the MCP Apps
  handshake (`hostCapabilities.serverTools`), never from a user agent or a
  vendor global. A host that cannot proxy tools/call from this frame gets the
  same control wired to a prefilled message: the widget composes the request
  and hands it to the conversation (`ui/message`), and the model performs the
  call. The server can force that path on every host (`widget.direct_calls`
  in the payload) — the proof that there is one widget, not one per vendor.
  Theme and platform come from the host context the same way, and land as
  `data-theme` / `data-platform` on the root for host-conditional styling.
-->

  // ---- reading a ruleset out of its source and manifest --------------------
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const SECTION_RE = /^\s*\/\/\s*-{3,}\s*(.+?)\s*-{3,}/;

  const PROSE_LINE = /^\s*\/\/(?!\s*@)(?!\s*-{3,})/;

      if (pi) out.push("//");

        if (line && (line + " " + w).length > 76) { out.push("// " + line); line = w; }

      m = l.match(/^\s*\/\/\s*@context\s+(\S+) ?(.*)$/);
      if (m && !(m[1] in ctx)) ctx[m[1]] = m[2];

    return { ask: ask, ctx: ctx };
  }
  // Line diff by longest common subsequence, after trimming the shared ends.
  function diffLines(a, b) {
    let s = 0;
    while (s < a.length && s < b.length && a[s] === b[s]) s++;
    let ea = a.length, eb = b.length;
    while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea--; eb--; }
    const A = a.slice(s, ea), B = b.slice(s, eb), n = A.length, m = B.length, W = m + 1;
    const L = new Uint32Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        L[i * W + j] = A[i] === B[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
      }
    }
    const added = {};
    let i = 0, j = 0, removed = 0;
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { i++; j++; }
      else if (j < m && (i >= n || L[i * W + j + 1] >= L[(i + 1) * W + j])) { added[s + j + 1] = true; j++; }
      else { removed++; i++; }
    }
    return { added: added, addedCount: Object.keys(added).length, removed: removed };
  }

  function prepare(p) {
    const manifest = p.manifest || {};
    const src = typeof p.source === "string" ? p.source : "";
    const lines = src.split("\n");
    // Section headers are the one grouping the source itself offers: comment
    // lines of the form "// ---- Title ----". Nothing is read from claim names.
    const sections = [], ask = {}, decl = {};
    let firstAssert = 0, firstDecl = 0;
    lines.forEach((l, i) => {
      let m = l.match(SECTION_RE);
      if (m) sections.push({ label: m[1], line: i + 1 });
      if ((m = l.match(/^\s*\/\/\s*@ask\s+(\S+)/)) && !ask[m[1]]) ask[m[1]] = i + 1;
      if ((m = l.match(/^\s*declare\s+(?:local\s+)?(\w+)/)) && !decl[m[1]]) decl[m[1]] = i + 1;
      if (!firstAssert && /^\s*assert\s/.test(l)) firstAssert = i + 1;
      if (!firstDecl && /^\s*declare\s/.test(l)) firstDecl = i + 1;
    });
    const secAt = (line) => {
      let s = null;
      sections.forEach((x) => { if (x.line <= line) s = x; });
      return s;
    };
    const claims = (manifest.claims || []).map((c) => {
      const q = c.question || "";
      const line = ask[c.claim] || decl[c.claim] || 0;
      const sx = line ? secAt(line) : null;
      return {
        id: c.claim, q: q, ctx: c.context || "", type: c.data_type, vocab: c.vocabulary || null,
        unit: c.unit || "", range: c.range || null, line: line, sec: sx ? cap(sx.label) : "", usedBy: [],
        hay: (c.claim + " " + q + " " + (c.context || "") + " " + (sx ? sx.label : "")).toLowerCase(),
      };
    });
    const byId = {};
    claims.forEach((c) => { byId[c.id] = c; });

    const all = src.split("\n");
    const rules = [];
    (manifest.rules || []).forEach((r) => {
      (r.assertions || []).forEach((a) => {
        const s = a.source || "";
        const reads = [];
        (s.replace(/\/\/[^\n]*/g, "").replace(/"(?:[^"\\]|\\.)*"/g, "").match(/[A-Za-z_]\w*/g) || [])
          .forEach((t) => { if (byId[t] && reads.indexOf(t) < 0) reads.push(t); });
        const blk = src ? findBlock(all, a.name) : null;
        rules.push({
          name: a.name, rule: r.rule, source: s, line: a.line || (blk ? blk[0] + 1 : 0),
          policy: a.unknown_policy || "neutral", reads: reads, title: cap(String(a.name).replace(/_/g, " ")),
        });
        reads.forEach((id) => { byId[id].usedBy.push(a.name); });

    });
    rules.sort((a, b) => a.line - b.line);
    rules.forEach((r, i) => { r.num = i + 1; });
    const ruleBy = {};
    rules.forEach((r) => { ruleBy[r.name] = r; });

    // The committed text of each rule block and each claim's wording, for
    // telling an edit apart from what was compiled.
    const blockText = {}, proseText = {};
    rules.forEach((r) => {
      const b = src ? findBlock(all, r.name) : null;
      blockText[r.name] = b ? all.slice(b[0], b[1] + 1).join("\n") : "";
      r.prose = b ? proseAbove(all, b[0]).text : "";
      proseText[r.name] = r.prose;
      r.hay = (r.name + " " + r.title + " " + r.prose).toLowerCase();

    const committed = annotations(all);
    // Where the Source tab can jump: the top, the declarations, the source's
    // own section headers, and every rule.
    const jump = [{ label: "Top", line: 1 }];
    if (firstDecl > 1) jump.push({ label: "Declarations", line: firstDecl });
    sections.forEach((x) => jump.push(x));
    jump.sort((a, b) => a.line - b.line);
    const contract = p.validation_contract || {};

    return {
      name: typeof p.name === "string" && p.name ? p.name : null,
      hash: p.ruleset_hash || manifest.ruleset_hash || "",
      source: src, hasSource: !!src, jump: jump, claims: claims, byId: byId, rules: rules, ruleBy: ruleBy,
      stored: p.stored || {}, label: p.label || {}, approvals: Array.isArray(p.approvals) ? p.approvals : [],
      unbridged: p.unbridged_units || [], unitLibraryHash: p.unit_library_hash || "",
      budgets: contract.budgets || {}, blockText: blockText, proseText: proseText,
      askText: committed.ask, ctxText: committed.ctx,
      pessCount: rules.filter((r) => r.policy === "pessimistic").length,
      enumCount: claims.filter((c) => c.type === "enum").length,
    };
  }

  // ---- state ------------------------------------------------------------
  const state = {
    view: "empty",
    mobile: false,
    displayMode: "inline",
    // A request handed to the chat for the assistant: {kind, status, rules}.
    handoff: null,
    // A newer revision of this ruleset's name, held while the person has
    // unsaved edits of their own.
    newer: null,
    environment: null,
    build: null,
    // The library rows, or null when this frame has never seen a listing (a
    // widget opened straight onto one ruleset). Non-null is what puts the back
    // control on the header.
    library: null,
    lib: { search: "", filter: "all", sort: "recent", shown: LIB_PAGE, opening: null, note: "", noteCls: "" },
    d: null,
    // "review" edits and approves; "check" presents one dsail_check result
    // read-only, with the values the assistant sent kept as a baseline so a
    // person's correction is marked as theirs.
    mode: "review",
    baseline: null,
    valuesKnown: true,
    apiUrl: DEFAULT_API_URL,
    values: {},
    unitOf: {},
    tab: "rules",
    search: "",
    ruleFilter: "all",
    ruleOpen: {},
    expanded: {},
    rgOpen: {},
    srcOpen: {},
    proseBuf: {},
    status: "idle",
    errMsg: "",
    errOpen: false,
    result: null,
    draft: "",
    commit: null,
    commitMsg: "",
    diags: [],
    wrap: true,
    hl: null,
    scrollTo: null,
    flash: null,
    sheet: null,
    approver: "",
    note: "",
    saveName: "",
    approving: false,
    approveErr: "",
    approveRelayed: false,
    codeOpen: false,
    codeLang: "python",
    keyStatus: "idle",
    keyTxt: "",
    keyLabel: "",
    keyErr: "",
    copied: "",
    units: { loaded: false, payload: null, relayed: false, err: "" },
    addOpen: false,
    conv: { from: "", to: "", factor: "", offset: "0", attribution: "" },
    convBusy: false,
    convErr: "",
    convRelayed: false,

  const sourceByHash = {};

  // approving and committing move a name, and both happen here, so a refetch
  // is needed exactly then rather than on every return to the list.
  let libraryStale = false;
  let checkToken = 0;
  let waitTimer = null;
  let copyTimer = null;
  let ranges = {};
  let di = null;

  // ---- the draft ----------------------------------------------------------
  function rangeOf(lines, name) {
    const x = ranges[name];
    if (x && x[1] < lines.length) return x;
    const b = findBlock(lines, name);
    if (b) ranges[name] = b; else delete ranges[name];
    return b;
  }
  function setDraft(draft, keepRanges) {
    if (!keepRanges) ranges = {};
    state.draft = draft;
    if (state.commit !== "compiling") { state.commit = null; state.commitMsg = ""; }
    state.diags = [];
  }
  function draftInfo() {
    const d = state.d;

    const dirty = state.draft !== d.source;
    const info = {
      draft: state.draft, d: d, lines: lines, dirty: dirty, ask: d.askText, ctx: d.ctxText, changed: {},
      addedCount: 0, removed: 0, editedRules: {}, editedClaims: {}, nRules: 0, nClaims: 0,
    };

      d.rules.forEach((r) => {

          proseAbove(lines, b[0]).text !== d.proseText[r.name];

  }
  function editRule(name, text) {

    const delta = nl.length - (r[1] - r[0] + 1);
    lines.splice.apply(lines, [r[0], r[1] - r[0] + 1].concat(nl));
    // A rule edit knows exactly which lines are its own, so a half-typed
    // brace never lets the block run on into the next rule.
    const next = {};
    Object.keys(ranges).forEach((k) => {
      const x = ranges[k];
      next[k] = x[0] > r[0] ? [x[0] + delta, x[1] + delta] : x;
    });

  }
  // The textarea keeps what was typed while it has focus; the source gets
  // the same words re-wrapped as a comment block above the assert.
  function setProse(name, text) {

    const b = findBlock(lines, name);
    if (!b) return;
    const pa = proseAbove(lines, b[0]);
    const nl = text.trim() ? toComment(text) : [];

    setDraft(lines.join("\n"));
  }
  // `// @ask <claim> text` and `// @context <claim> text` are named
  // directives (agent_api/annotations.py), so rewriting one line never
  // disturbs another claim's. A blank context removes its line; a new one is
  // inserted after the claim's question, or its declare.
  function setAnnotation(kind, id, text) {
    const lines = state.draft.split("\n");
    const re = new RegExp("^\\s*//\\s*@" + kind + "\\s+" + reEsc(id) + "(?:\\s|$)");
    const k = lines.findIndex((l) => re.test(l));
    const clean = text.replace(/\s*\n\s*/g, " ").trim();
    const line = "// @" + kind + " " + id + " " + clean;

    } else if (k >= 0) {
      lines[k] = line;
    } else {
      const askRe = new RegExp("^\\s*//\\s*@ask\\s+" + reEsc(id) + "(?:\\s|$)");
      const declRe = new RegExp("^\\s*declare\\s+(?:local\\s+)?" + reEsc(id) + "\\b");

    setDraft(lines.join("\n"));
  }

  // ---- values -------------------------------------------------------------
  function blankValues(d) {
    const v = {};
    d.claims.forEach((c) => { v[c.id] = "unknown"; });
    return v;
  }
  // The wire form dsail_check takes: booleans as booleans, "unknown" as the
  // string, a quantity as "340 USD" when it carries a unit.
  function wireValues() {
    const out = {};
    state.d.claims.forEach((c) => {
      const v = state.values[c.id];
      if (v === undefined || v === null || v === "unknown" || v === "") { out[c.id] = "unknown"; return; }
      if (c.type === "boolean") { out[c.id] = v === "true"; return; }
      if (c.type === "numeric") {
        const unit = (state.unitOf[c.id] !== undefined ? state.unitOf[c.id] : c.unit || "").trim();
        out[c.id] = unit ? v + " " + unit : (isFinite(Number(v)) ? Number(v) : v);

  }
  // What the assistant sent a check, read back into the controls.
  function fromWire(claims, d) {
    const v = blankValues(d);
    const units = {};
    Object.keys(claims || {}).forEach((id) => {
      const x = claims[id];
      if (x === null || x === undefined || x === "unknown") v[id] = "unknown";
      else if (x === true || x === false) v[id] = String(x);
      else if (typeof x === "number") v[id] = String(x);
      else {
        const c = d.byId[id];
        const m = c && c.type === "numeric" ? String(x).match(/^\s*(-?[\d.,]+(?:e[+-]?\d+)?)\s*(.*)$/i) : null;
        if (m) { v[id] = m[1]; units[id] = m[2]; } else v[id] = String(x);
      }

  }
  // Unknown is an answer like Yes and No, so counts report the mix, never
  // progress.
  function mix(ids) {
    let y = 0, n = 0, u = 0, answered = 0;
    const chosen = {};
    ids.forEach((id) => {
      const v = state.values[id] || "unknown";
      const c = state.d && state.d.byId[id];
      if (v === "true") y++; else if (v === "false") n++; else if (v === "unknown") u++;
      else if (c && c.type === "enum") chosen[v] = (chosen[v] || 0) + 1;
      else answered++;
    });
    if (u === ids.length && ids.length > 1) return "all unknown";
    return [y ? y + " yes" : "", n ? n + " no" : ""]
      .concat(Object.keys(chosen).map((k) => chosen[k] + " " + k), [answered ? answered + " answered" : "", u ? u + " unknown" : ""])
      .filter(Boolean).join(", ");
  }
  function valueLabel(c, v) {
    if (v === undefined || v === "unknown") return "Unknown";
    if (v === "true") return "Yes";
    if (v === "false") return "No";
    return cap(String(v));
  }

  // ---- results ------------------------------------------------------------
  function readResult(payload, values) {
    const byName = {}, tally = {};
    (payload.rules || []).forEach((r) => (r.assertions || []).forEach((a) => {
      const check = a.check || "UNKNOWN";
      byName[a.name] = Object.assign({}, a, { check: check });
      tally[check] = (tally[check] || 0) + 1;
    }));
    return {
      byName: byName, tally: tally, snap: JSON.stringify(values), values: Object.assign({}, values),

    };
  }

  // service passes an unrecognised check through verbatim rather than
  // translating it, so discarding it here would make the tally disagree with
  // the rows underneath it.
  function tallyOrder(tally) {
    return RESULTS.concat(Object.keys(tally).filter((k) => RESULTS.indexOf(k) < 0)).filter((k) => tally[k]);
  }
  const vClass = (v) => "v-" + (RESULTS.indexOf(v) >= 0 ? v : v ? "other" : "none");

  function describeError(err) {
    const parts = [];
    if (err.diagnostics && err.diagnostics.length) {
      err.diagnostics.forEach((d) => parts.push((d.line ? "line " + d.line + ": " : "") + (d.message || JSON.stringify(d))));
    } else if (err.failures && err.failures.length) {
      err.failures.forEach((f) => parts.push(f.field + ": expected " + f.expected + ", got " + f.received));
    } else {
      parts.push(err.message || "the call did not succeed");
    }
    return parts;
  }

  // ---- hydrating ------------------------------------------------------------
  function hydrate(payload, opts) {
    const o = opts || {};
    const prevName = state.d ? state.d.name : null;
    const d = prepare(payload);
    // The name is KEPT when a payload carries none. A commit produces a new
    // hash that nothing names yet, and it is a revision OF the ruleset being
    // edited — dropping the name here would make approving ask for one again
    // on every edit of something already in the library.
    if (!d.name && o.keepName && prevName) d.name = prevName;
    if (o.stored) d.stored = o.stored;
    if (d.source) sourceByHash[d.hash] = d.source;
    const prevValues = state.values;
    const prevUnits = state.unitOf;
    state.d = d;
    state.draft = d.source;
    ranges = {};
    di = null;
    const values = blankValues(d);
    if (o.keepValues) {
      Object.keys(values).forEach((id) => { if (prevValues[id] !== undefined) values[id] = prevValues[id]; });

    } else {
      state.unitOf = {};
    }
    state.values = values;
    state.view = "review";
    state.mode = o.mode || "review";
    state.baseline = null;
    state.valuesKnown = true;
    state.tab = "rules";
    state.search = "";
    state.ruleFilter = "all";
    state.expanded = {};
    state.rgOpen = {};
    state.srcOpen = {};
    state.proseBuf = {};
    state.ruleOpen = {};
    state.handoff = null;
    state.newer = null;
    if (d.name && state.mode === "review") watchName(WATCH_ON_OPEN_MS);
    state.status = "idle";
    state.result = null;
    state.errMsg = "";
    state.errOpen = false;
    state.commit = o.commit || null;
    state.commitMsg = o.commitMsg || "";
    state.diags = [];
    state.hl = null;
    state.sheet = null;
    state.approving = false;
    state.approveErr = "";
    state.approveRelayed = false;
    state.codeOpen = false;
    state.keyStatus = "idle";
    state.keyTxt = "";
    state.keyErr = "";
    state.units = { loaded: false, payload: null, relayed: false, err: "" };
  }

  function hydrateCheck(payload, context) {
    const ctx = context || {};
    const review = ctx.review && ctx.review.manifest ? ctx.review : null;
    let synthetic = review;
    if (!synthetic) {
      // No ruleset context reached this frame: rules come from the result
      // itself, and a claim is known only by its name.
      const names = {};
      Object.keys(ctx.claims || {}).forEach((k) => { names[k] = true; });
      ((payload.claims && payload.claims.bound) || []).concat((payload.claims && payload.claims.unbound) || [])
        .forEach((k) => { names[k] = true; });
      synthetic = {
        ruleset_hash: payload.ruleset_hash,
        unit_library_hash: payload.unit_library_hash,
        manifest: {
          claims: Object.keys(names).sort().map((k) => {
            const x = ctx.claims ? ctx.claims[k] : undefined;
            return { claim: k, data_type: typeof x === "boolean" ? "boolean" : typeof x === "number" ? "numeric" : "text" };
          }),
          rules: (payload.rules || []).map((r) => ({
            rule: r.rule, assertions: (r.assertions || []).map((a, i) => ({
              name: a.name, source: a.source || "", unknown_policy: a.unknown_policy, line: i + 1,

          })),
        },
      };
    }
    hydrate(synthetic, { mode: "check" });
    state.apiUrl = typeof ctx.api_url === "string" && ctx.api_url ? ctx.api_url.replace(/\/+$/, "") : DEFAULT_API_URL;
    state.valuesKnown = !!ctx.claims;
    const read = fromWire(ctx.claims || {}, state.d);
    state.values = read.values;
    state.unitOf = read.units;
    state.baseline = Object.assign({}, read.values);
    state.result = readResult(payload, state.values);
    state.status = "done";
    const firstFalse = state.d.rules.find((r) => (state.result.byName[r.name] || {}).check === "FALSE");
    state.ruleOpen = firstFalse ? { [firstFalse.name]: true } : {};
  }

  function parseResult(result) {
    if (result && result.structuredContent) return result.structuredContent;
    try { return JSON.parse(result.content[0].text); } catch (e) { return null; }
  }
  function checkContext(result) { return contextOf(result, "dsail/check"); }
  function contextOf(result, key) {
    const meta = result && (result._meta || result.meta);
    return meta && typeof meta === "object" ? meta[key] || null : null;
  }

  const app = shell.app;
  app.onerror = (e) => console.error("[dsail-widget]", e);

  // ---- the host: what it can do, and how it looks (TJP-620) ----------------
  // Capability detection is a runtime probe of the MCP Apps handshake, never a
  // vendor check. `serverTools`: the host proxies tools/call from this frame.
  // `message`: the host accepts a ui/message and the model acts on it. A shim
  // with no probe at all (the `dsail serve` page, which IS the tool router) is
  // treated as direct-capable, because its callServerTool is the whole point.
  const host = {
    probed: typeof app.getHostCapabilities === "function",
    caps: {},
    ctx: {},
    // The server's say, from `payload.widget.direct_calls` (wire 2.3.0). False
    // forces the relay on a host that could call directly — the proof that the
    // fallback is one code path in one widget, not a second widget.
    directAllowed: true,
  };
  function readHost() {
    try { host.caps = (host.probed && app.getHostCapabilities()) || {}; } catch (e) { host.caps = {}; }
    try { host.ctx = (typeof app.getHostContext === "function" && app.getHostContext()) || {}; } catch (e) { host.ctx = {}; }
  }
  function canCallDirect() {
    if (!host.directAllowed) return false;
    return host.probed ? !!host.caps.serverTools : true;
  }
  function canRelay() {
    if (typeof app.sendMessage !== "function") return false;
    return host.probed ? !!host.caps.message : false;
  }
  function relayActive() { return !canCallDirect(); }
  function canFullscreen() {
    return typeof app.requestDisplayMode === "function" &&
      (host.ctx.availableDisplayModes || []).indexOf("fullscreen") >= 0;
  }

  // One call site for every tool the widget invokes. Direct when the host
  // allows it; otherwise the composed request goes to the conversation as a
  // user message and the result is `{relayed: true}` — the caller then says so
  // and waits for the model, which re-renders this widget with dsail_review.
  async function invoke(call, relay) {
    if (canCallDirect()) return { result: await app.callServerTool(call) };
    if (canRelay()) {
      await app.sendMessage({ role: "user", content: [{ type: "text", text: relay }] });
      return { relayed: true };
    }
    throw new Error(
      "This chat client cannot run tools from inside the widget and does not " +
      "accept messages from it. Ask the assistant directly: " + relay.split("\n")[0]
    );
  }

  // The calls a relay must never make on a person's behalf, because nobody
  // asked for them: following the ruleset's name, refreshing the library,
  // and moving the name after a direct commit. Direct or not at all.
  let hostReported = false;
  async function quietCall(call) {
    if (!canCallDirect()) throw new Error("this host does not run tools from the widget");
    if (!hostReported) {
      // What this host offers a frame, by capability name only, once per
      // frame: the server logs it, because nothing else can say whether a
      // host takes context or sampling from a widget.
      hostReported = true;
      call = Object.assign({}, call, { _meta: { "dsail/host": Object.keys(host.caps || {}).slice(0, 16) } });
    }
    return app.callServerTool(call);
  }

  // The composed messages. Each names the tool and the exact arguments, because
  // the model is asked to relay the user's action, not to interpret it; the
  // server instructions tell it to make exactly that call and then review the
  // resulting hash. Source travels in a fenced block, byte for byte.
  function relayApproval(name, approver, note) {
    const hash = state.d.hash;
    return "Record my approval of DSAIL ruleset " + hash + " (name \"" + name + "\").\n" +
      "Call dsail_record_approval with ruleset_hash=\"" + hash + "\", approver=\"" + approver +
      "\", note=" + (note ? JSON.stringify(note) : "null") + ", name=\"" + name + "\" — exactly these " +
      "arguments — then call dsail_review(\"" + hash + "\") so I can see it recorded.";
  }
  function relayCommit(source) {
    const d = state.d;
    return "Commit my edit to DSAIL ruleset " + (d.name ? "\"" + d.name + "\"" : d.hash) + ".\n" +
      "Call dsail_compile with parent_hash=\"" + d.hash + "\" and EXACTLY this source, byte for byte:\n\n" +
      "```dsail\n" + source + "\n```\n\n" +
      (d.name
        ? "If it compiles, call dsail_save_ruleset with name=\"" + d.name + "\" and the same source, then "
        : "If it compiles, ") +
      "call dsail_review with the new ruleset_hash. If it does not compile, show me the diagnostics and change nothing.";
  }
  function relayCheck(claims) {
    const hash = state.d.hash;
    return "Check DSAIL ruleset " + hash + " against these claim values:\n\n```json\n" +
      JSON.stringify(claims, null, 2) + "\n```\n\n" +
      "Call dsail_check with ruleset_hash=\"" + hash + "\" and claims exactly as given, and report " +
      "what the rules concluded for each assertion, in their own words.";
  }
  function relayLoad(name) {
    return "Open my DSAIL ruleset \"" + name + "\": call dsail_review with name=\"" + name + "\".";
  }
  function relayReview(hash) {
    return "Open DSAIL ruleset " + hash + " in the review widget: call dsail_review with ruleset_hash=\"" + hash + "\".";
  }
  function relayUnits() {
    return "Show this project's DSAIL unit conversion library: call dsail_unit_library with no arguments.";
  }
  function relayConverter(args) {
    return "Add a unit converter to my DSAIL project: call dsail_add_unit_converter with from_unit=\"" +
      args.from_unit + "\", to_unit=\"" + args.to_unit + "\", factor=" + args.factor + ", offset=" + args.offset +
      ", attribution=" + (args.attribution ? JSON.stringify(args.attribution) : "null") +
      " — the factor is mine, do not change it — then show me the updated library.";
  }
  // ---- asking the assistant to write DSAIL -------------------------------
  // Every other control has all of its tool's arguments in hand and calls the
  // tool itself. Turning a description into DSAIL needs content nobody has
  // yet, and only the assistant writes it. A host starts its model only on a
  // message the person sends (claude.ai declares neither sampling nor
  // anything else a frame or a server could start it with, measured
  // 2026-09-30), so the widget writes that message — one plain line in the
  // person's message box — and says, unmistakably, that it is waiting for
  // Enter. The details ride out of sight in the model's context where the
  // host takes context from a frame, and in the message where it does not.

  // `source` with the description above `name` replaced by `text`.
  function withProse(source, name, text) {
    const lines = source.split("\n");
    const b = findBlock(lines, name);
    if (!b) return source;
    const pa = proseAbove(lines, b[0]);
    const nl = text.trim() ? toComment(text) : [];
    lines.splice.apply(lines, [pa.start, b[0] - pa.start].concat(nl));
    return lines.join("\n");
  }
  // The rules whose description the person changed and the DSAIL does not yet
  // follow: [{rule, prose}].
  function changedDescriptions() {
    const lines = state.draft.split("\n");
    return state.d.rules.map((r) => {
      const b = findBlock(lines, r.name);
      const prose = state.proseBuf[r.name] !== undefined ? state.proseBuf[r.name] : (b ? proseAbove(lines, b[0]).text : "");
      return { rule: r, prose: prose.trim() };
    }).filter((x) => x.prose && x.prose !== (x.rule.prose || "").trim());
  }
  // Whether the draft differs from the compiled source only by those
  // descriptions — then the assistant needs nothing but the descriptions.
  function onlyDescriptionsChanged(items) {
    let source = state.d.source;
    items.forEach((x) => { source = withProse(source, x.rule.name, x.prose); });
    return source === state.draft;
  }
  const quoted = (text) => "“" + text.replace(/\s+/g, " ").trim() + "”";
  function rulesetPhrase() {
    const d = state.d;
    return d.name ? "my DSAIL ruleset “" + d.name + "”" : "my DSAIL ruleset";
  }
  // The line the person sees and sends when the details went privately: short,
  // and plainly their own request.
  // What the person sends once their descriptions are saved: which way the
  // change runs is stated outright — the description is right and the DSAIL
  // follows it — because a model that finds the two disagreeing cannot tell
  // which one is the edit (measured 2026-09-30: it asked).
  function handoffShortLine(kind, items) {
    const where = " in DSAIL ruleset “" + state.d.name + "”";
    if (kind === "describe") return "Describe the rules" + where + " that have no description.";
    if (items.length === 1) {
      return "I changed the description of the " + quoted(items[0].rule.title) + " rule" + where + " to: " +
        quoted(items[0].prose) + " Update the rule's DSAIL to match it.";
    }
    return "I changed the descriptions of " + items.length + " rules" + where + ":\n" +
      items.map((x) => "• " + quoted(x.rule.title) + ": " + quoted(x.prose)).join("\n") +
      "\nUpdate their DSAIL to match.";
  }
  function handoffLine(kind, items) {
    if (kind === "describe") {
      return "Add a plain-words description to each rule in " + rulesetPhrase() + " that does not have one.";
    }
    if (items.length === 1) {
      return "Update the " + quoted(items[0].rule.title) + " rule in " + rulesetPhrase() +
        " to match its new description: " + quoted(items[0].prose);
    }
    return "Update " + items.length + " rules in " + rulesetPhrase() + " to match their new descriptions:\n" +
      items.map((x) => "• " + quoted(x.rule.title) + ": " + quoted(x.prose)).join("\n");
  }
  function handoffDetails(kind, items) {
    const d = state.d;
    const what = kind === "describe"
      ? "add a plain-words description, as a comment block directly above the assert, to every rule that has none, changing no DSAIL"
      : "rewrite " + items.map((x) => "assert " + x.rule.name).join(", ") + " so each does exactly what its new description says";
    return "The DSAIL review widget is asking you to " + what + ". The person wrote " +
      (kind === "describe" ? "this request" : "these descriptions") + " in the widget and confirmed them there; do not ask them to confirm again. " +
      "Ruleset " + (d.name ? "“" + d.name + "” " : "") + "at revision " + d.hash + ". Start from EXACTLY this source, which carries the person's current edits:\n\n" +
      "```dsail\n" + state.draft + "\n```\n\n" +
      (kind === "describe" ? "" : "Add, remove or change claim declarations and their // @ask, @context, @unit and @range lines as the new descriptions need. " +
        "Leave every other rule and its description exactly as it is. If a description is ambiguous, ask the person before compiling. ") +
      "Then call dsail_compile with parent_hash=\"" + d.hash + "\" and the updated source, fix any diagnostics" +
      (d.name ? ", call dsail_save_ruleset with name=\"" + d.name + "\" and the same source" : "") +
      ", and call dsail_review with the new ruleset_hash so the person sees the new revision.";
  }
  async function handOff(kind) {
    const items = kind === "describe" ? [] : changedDescriptions();
    if (kind !== "describe" && !items.length) return;
    const line = handoffLine(kind, items);
    let details = handoffDetails(kind, items);
    if (!canRelay()) {
      state.handoff = { kind: kind, status: "error", line: line,
        msg: "This chat app does not take requests from the widget. Ask the assistant in the chat:" };
      render();
      return;
    }
    let text = line;
    try {
      // A named ruleset takes the person's words first: the draft is saved
      // under the name as its own revision, so whatever the assistant reads
      // back already carries the new descriptions and nothing it shows can be
      // older than the edit. The line then only has to say what to apply.
      let stored = false;
      if (kind === "rewrite" && state.d.name && canCallDirect()) {
        const result = await quietCall({ name: "dsail_save_ruleset", arguments: { name: state.d.name, source: state.draft } });
        const payload = parseResult(result) || {};
        if (!payload.ok) {
          state.handoff = { kind: kind, status: "error", line: line,
            msg: "Your edit could not be saved (" + describeError(payload.error || {}).join("; ") + "). Fix it, or ask the assistant in the chat:" };
          render();
          return;
        }
        const saved = contextOf(result, "dsail/save");
        if (saved && saved.review) {
          hydrate(saved.review, { keepName: true, keepValues: true });
          items.forEach((x) => { state.ruleOpen[x.rule.name] = true; });
        }
        libraryStale = true;
        stored = true;
        // Everything the assistant is told now names the revision just saved.
        details = handoffDetails(kind, items);
      }
      if (typeof app.updateModelContext === "function") {
        try {
          await app.updateModelContext({ content: [{ type: "text", text: details }] });
        } catch (e) {
          console.warn("[dsail-widget] the host took no context from the frame", e);
        }
      }
      if (stored || (kind === "describe" && state.d.name)) {
        text = handoffShortLine(kind, items);
      } else if (kind === "describe" || onlyDescriptionsChanged(items)) {
        // The name is enough to load it by; a ruleset with none needs its hash.
        if (!state.d.name) text = line + " (revision " + state.d.hash + ")";
      } else {
        text = line + "\n\n" + details;
      }
      await app.sendMessage({ role: "user", content: [{ type: "text", text: text }] });
      state.handoff = { kind: kind, status: "waiting", rules: items.map((x) => x.rule.name) };
      watchName(WATCH_FOR_MS);
    } catch (e) {
      state.handoff = { kind: kind, status: "error", line: line, msg: "The request did not reach the chat (" + String((e && e.message) || e) + "). Ask the assistant in the chat:" };
    }
    render();
  }

  function relayIssueKey(label) {
    return "Issue me a DSAIL API key for code that runs outside this chat.\n" +
      "Call dsail_issue_api_key with label=" + (label ? JSON.stringify(label) : "null") +
      " — exactly this argument — and show me the key once.";
  }

  // Theme and platform, from the host's own context rather than guessed. The
  // stylesheet keys on these two attributes; a host that says nothing leaves
  // the system preference in charge.
  function applyHostContext(ctx) {
    const root = document.documentElement;
    if (ctx.displayMode) state.displayMode = ctx.displayMode;
    if (ctx.theme === "dark" || ctx.theme === "light") root.setAttribute("data-theme", ctx.theme);
    else root.removeAttribute("data-theme");
    if (ctx.platform) root.setAttribute("data-platform", String(ctx.platform));
  }
  function isMobile() {
    return host.ctx.platform === "mobile" || (window.innerWidth || 736) < 560;
  }
  // The frame's height. The host's container, when it names one, caps it. A
  // page with no host at all (`dsail serve`) is the whole window, so the frame
  // fills it.
  function frameHeight() {
    if (state.displayMode === "fullscreen") {
      const insets = host.ctx.safeAreaInsets || {};
      const reserve = Number(insets.bottom) > 0 ? Number(insets.bottom) : COMPOSER_RESERVE_PX;
      return Math.max(360, (window.innerHeight || 720) - reserve - 2);
    }
    let h = state.mobile ? 720 : state.view === "library" || state.mode === "check" ? 720 : 640;
    if (!host.probed) h = Math.max(480, (window.innerHeight || h) - 24);
    const dims = host.ctx.containerDimensions || {};
    const limit = Number(dims.maxHeight || dims.height) || 0;
    if (limit > 0) h = Math.max(360, Math.min(h, limit));
    return h;
  }
  readHost();
  applyHostContext(host.ctx);
  if (host.probed) {
    try {
      app.onhostcontextchanged = (changed) => {
        host.ctx = Object.assign({}, host.ctx, changed || {});
        applyHostContext(host.ctx);
        render();
      };
    } catch (e) { console.warn("[dsail-widget] host context changes unavailable", e); }
  }

  function renderEnvironment() {
    const text = state.environment
      ? state.environment + (state.build ? " · " + state.build : "")
      : "";
    for (const id of ["env-badge", "lib-env-badge"]) {
      const badge = $(id);
      if (!badge) continue;
      badge.textContent = text;
      badge.hidden = !text;
    }
  }

  function copyToClipboard(text, what) {
    const done = () => {
      state.copied = what;
      render();
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => { state.copied = ""; render(); }, 1500);
    };
    // The async Clipboard API needs the clipboard-write permission the `ui://`
    // resource asks for (mcp_app.py). A host may decline it, and older ones do
    // not implement it at all, so the selection-and-execCommand path stays as
    // the fallback rather than leaving the one control a person needs inert.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
    } else {
      legacyCopy(text, done);
    }
  }
  function legacyCopy(text, done) {
    const scratch = document.createElement("textarea");
    scratch.value = text;
    scratch.setAttribute("readonly", "");
    scratch.style.position = "fixed";
    scratch.style.top = "-1000px";
    document.body.appendChild(scratch);
    scratch.select();
    try {
      if (document.execCommand("copy")) done();
    } catch (e) {
      console.error("[dsail-widget] clipboard unavailable", e);
    }
    document.body.removeChild(scratch);
  }

  // The stored timestamp is UTC ISO 8601. Rendered in the reader's own locale
  // because "when did this last change" is a question about their day, and
  // shown as raw text if the browser cannot parse it rather than as "Invalid
  // Date", which reads like a corrupted record.
  function whenText(stamp) {
    if (!stamp) return "";
    const at = new Date(stamp);
    if (isNaN(at.getTime())) return stamp;
    return at.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  // ---- rendering: shared pieces ---------------------------------------------
  const tid = (name) => ' data-testid="' + name + '"';
  const ENV_TITLE = ' title="This is not the production deployment. Environment name and widget build."';
  const ENV_BADGE = '<span id="env-badge" class="pill env" hidden' + ENV_TITLE + tid("widget-env-badge") + "></span>";
  const LIB_ENV_BADGE = '<span id="lib-env-badge" class="pill env" hidden' + ENV_TITLE + tid("widget-env-badge") + "></span>";
  const relayBadge = () => relayActive()
    ? '<span class="pill relay" title="This chat client does not run tools from inside the widget. Each action here is handed to the conversation and the assistant performs it.">via conversation</span>'
    : "";

  function render() {
    state.mobile = isMobile();
    $("empty").hidden = state.view !== "empty";
    $("library").hidden = state.view !== "library";
    $("app").hidden = state.view !== "review";
    if (state.view === "library") renderLibrary();
    if (state.view === "review") renderApp();
    renderEnvironment();
  }

  const fullscreenBtn = () => canFullscreen()
    ? '<button class="ibtn" data-act="fullscreen" aria-label="' + (state.displayMode === "fullscreen" ? "Exit full screen" : "Full screen") + '"' +
      tid("widget-fullscreen-toggle") + ">" + (state.displayMode === "fullscreen" ? ICON.shrink : ICON.expand) + "</button>"
    : "";
  function frame(el) {
    el.classList.toggle("m", state.mobile);
    el.style.setProperty("--wh", frameHeight() + "px");
  }

  // ---- the library ----------------------------------------------------------
  const LIB_FILTERS = [
    ["all", "All", "Every ruleset saved in this workspace."],
    ["approved", "Approved", "Someone has recorded an approval of the exact version shown."],
    ["pending", "Not approved", "No approval is recorded for the version shown. Earlier versions may have one."],
    ["broken", "Does not compile", "The saved source no longer compiles under the current engine, so what it decides cannot be read."],
  ];
  const LIB_TEST = {
    all: () => true,
    approved: (r) => r.approval_count > 0,
    pending: (r) => r.compiles !== false && !r.approval_count,
    broken: (r) => r.compiles === false,
  };
  function libraryRows() {
    const L = state.lib;
    const rows = state.library || [];
    const q = L.search.trim().toLowerCase();
    const sorts = {
      recent: (a, b) => (String(a.bound_at || "") < String(b.bound_at || "") ? 1 : -1),
      name: (a, b) => (a.name < b.name ? -1 : 1),
      rules: (a, b) => (b.rule_count || 0) - (a.rule_count || 0),
    };
    return rows.filter((r) => (!q || String(r.name).toLowerCase().indexOf(q) >= 0) && LIB_TEST[L.filter](r))
      .slice().sort(sorts[L.sort] || sorts.recent);
  }
  function renderLibrary() {
    const el = $("library");
    frame(el);
    const L = state.lib;
    const all = state.library || [];
    const counts = {};
    LIB_FILTERS.forEach((f) => { counts[f[0]] = all.filter(LIB_TEST[f[0]]).length; });
    const list = libraryRows();
    const visible = list.slice(0, L.shown);
    const rest = list.length - visible.length;
    const rows = visible.map((r) => {
      const broken = r.compiles === false;
      const ap = broken ? ["ap bad", "Does not compile"] : r.approval_count > 1 ? ["ap ok", r.approval_count + " approvals"]
        : r.approval_count === 1 ? ["ap ok", "Approved"] : ["ap", "Not approved"];
      const parts = [];
      if (typeof r.rule_count === "number") parts.push(plural(r.rule_count, "rule", "rules"));
      if (typeof r.claim_count === "number") parts.push(plural(r.claim_count, "claim", "claims"));
      if (r.revision_depth) parts.push("rev " + r.revision_depth);
      parts.push(shortHash(r.ruleset_hash));
      const sub = broken ? (r.summary || "Does not compile under the current engine.") : parts.join(", ");
      return '<button class="lr' + (broken ? " broken" : "") + '" data-act="lib-open" data-hash="' + esc(r.ruleset_hash) +
        '" data-name="' + esc(r.name) + '" aria-label="Open ' + esc(r.name) + '"' + tid("library-row-open") + ">" +
        '<span class="lr-main"><span class="lr-name">' + esc(r.name) + '</span><span class="lr-sub">' + esc(sub) + "</span></span>" +
        '<span class="lr-side"><span class="' + ap[0] + '">' + esc(ap[1]) + '</span><span class="lr-when">' +
        esc(whenText(r.bound_at)) + "</span></span></button>";
    }).join("");
    const chips = LIB_FILTERS.map((f) =>
      '<span class="tip-w"><button class="chip' + (L.filter === f[0] ? " on" : "") + '" aria-pressed="' + (L.filter === f[0]) +
      '" aria-describedby="lib-tip-' + f[0] + '" data-act="lib-filter" data-key="' + f[0] + '"' + tid("library-filter-chip") + ">" +
      esc(f[1]) + ' <span class="n">' + counts[f[0]] + '</span></button><span class="tip" role="tooltip" id="lib-tip-' + f[0] + '">' +
      esc(f[2]) + "</span></span>").join("");
    const searchFocused = document.activeElement && document.activeElement.id === "lib-search";
    const toolbar = '<div class="tb" id="lib-tb"><div class="tb-row wrap"><label class="search lsearch">' + ICON.search +
      '<span class="sr">Search rulesets</span><input id="lib-search" type="search" placeholder="Search ' +
      esc(plural(all.length, "ruleset", "rulesets")) + ' by name" value="' + esc(L.search) + '" data-in="lib-search"' +
      tid("library-search-input") + '></label><label class="sr" for="lib-sort">Sort</label>' +
      '<select class="sel lsel" id="lib-sort" data-ch="lib-sort"' + tid("library-sort-select") + ">" +
      [["recent", "Recently changed"], ["name", "Name, A to Z"], ["rules", "Most rules"]].map((o) =>
        '<option value="' + o[0] + '"' + (L.sort === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") +
      '</select></div><div class="chips" role="group" aria-label="Show rulesets">' + chips + "</div></div>";
    const listHtml = '<div id="lib-list">' +
      (!all.length
        ? '<div class="empty">Nothing saved here yet. Compile a ruleset and approve it, and it lands in this list.</div>'
        : !list.length ? '<div class="empty">No ruleset matches that search and filter.</div>' : "") +
      '<div class="list">' + rows + "</div>" +
      (rest > 0 ? '<div class="more"><button class="btn" data-act="lib-more"' + tid("library-show-more") + ">Show " +
        Math.min(LIB_PAGE, rest) + " more (" + rest + " not shown)</button></div>" : "") + "</div>";
    const foot = L.opening || L.note
      ? '<div class="ft' + (L.noteCls ? " " + L.noteCls : "") + '" aria-live="polite"><div class="st">' +
        (L.opening ? ICON.spin : L.noteCls === "err" ? ICON.err : ICON.info) +
        '<div class="st-tx"><div class="st-s">' + esc(L.opening ? "Opening " + L.opening + "…" : L.note) + "</div></div></div></div>"
      : "";
    if (searchFocused && $("lib-list")) {
      $("lib-list").outerHTML = listHtml;
      return;
    }
    const body = el.querySelector(".body");
    const top = body ? body.scrollTop : 0;
    el.innerHTML = '<header class="hd ruled"><span class="hd-name">Ruleset library</span>' + LIB_ENV_BADGE +
      relayBadge() + '<span class="hd-br"></span><span class="lmeta">' + esc(plural(all.length, "ruleset", "rulesets")) +
      "</span>" + fullscreenBtn() + "</header>" + '<div class="body">' + toolbar + listHtml + "</div>" + foot;
    const nb = el.querySelector(".body");
    if (nb) nb.scrollTop = top;
  }

  // ---- the review -------------------------------------------------------------
  const POLICY = {
    neutral: {
      tip: "The default. An unknown claim leaves the result UNKNOWN when the rule depends on it.",
      line: "",
    },
    pessimistic: {
      tip: "An unknown claim counts against the rule. If the rule cannot be shown to hold, it comes back FALSE instead of UNKNOWN.",
      line: "Pessimistic: an unknown claim counts against this rule, so it comes back FALSE rather than UNKNOWN when it cannot be shown to hold.",
    },
    optimistic: {
      tip: "An unknown claim counts in the rule's favor. If the rule cannot be shown to be violated, it comes back TRUE instead of UNKNOWN.",
      line: "Optimistic: an unknown claim counts in favor of this rule, so it comes back TRUE rather than UNKNOWN when it cannot be shown to be violated.",
    },
  };
  const FILTER_TIPS = {
    all: "Every rule in this ruleset, in the order the source states them.",
    FALSE: "Rules the last check found violated.",
    UNKNOWN: "Rules the last check could not decide, because a claim they need is still unknown.",
    TRUE: "Rules that held in the last check.",
    AMBIGUOUS: "Rules whose evidence was contradicted.",
    edited: "Rules you have changed and not committed yet.",
    neutral: POLICY.neutral.tip,
    pessimistic: POLICY.pessimistic.tip,
    optimistic: POLICY.optimistic.tip,
  };

  // Everything the view needs that more than one part of it reads.
  function view() {
    const d = state.d;
    const info = draftInfo();
    const res = state.result;
    const stale = !!res && res.snap !== JSON.stringify(state.values);
    const checkMode = state.mode === "check";
    const unitsNeeded = !checkMode && (d.unbridged.length > 0 || d.claims.some((c) => c.unit || c.type === "numeric"));
    const tab = checkMode ? "rules" : (state.tab === "units" && !unitsNeeded ? "rules" : state.tab);
    const approvals = d.approvals || [];
    return {
      d: d, di: info, dirty: info.dirty, res: res, stale: stale, checkMode: checkMode, editable: !checkMode,
      busy: state.status === "running" || state.status === "waiting", compiling: state.commit === "compiling",
      tab: tab, unitsNeeded: unitsNeeded, approvals: approvals,
      verdictOf: (n) => (res && res.byName[n] ? res.byName[n].check : null),
      q: (state.search || "").trim().toLowerCase(),
    };
  }

  function renderApp() {
    const el = $("app");
    frame(el);
    const v = view();
    const body = $("body");
    const top = body ? body.scrollTop : 0;
    el.innerHTML = '<header class="hd" id="hd">' + headerHtml(v) + "</header>" +
      (v.checkMode ? "" : '<nav class="tabs" id="tabs" role="tablist" aria-label="Review sections">' + tabsHtml(v) + "</nav>") +
      '<div class="body" id="body">' + bodyHtml(v) + "</div>" +
      '<footer class="ft" id="ft" aria-live="polite"></footer>' +
      '<div id="overlay">' + overlayHtml(v) + "</div>";
    if (v.checkMode) el.querySelector(".hd").classList.add("ruled");
    renderFooter(v);
    const nb = $("body");
    if (state.scrollTo) {
      const target = state.scrollTo;
      state.scrollTo = null;
      requestAnimationFrame(() => scrollToId(target));
    } else if (nb) {
      nb.scrollTop = top;
    }
  }
  // What typing changes: the header, the tabs, the footer and the rules
  // toolbar. Never the field being typed in.
  function renderChrome() {
    if (state.view !== "review") return;
    const v = view();
    if ($("hd")) $("hd").innerHTML = headerHtml(v);
    if ($("tabs")) $("tabs").innerHTML = tabsHtml(v);
    const tb = $("rules-tb");
    if (tb && !tb.contains(document.activeElement)) tb.outerHTML = rulesToolbarHtml(v);
    if ($("src-meta")) $("src-meta").textContent = srcMetaText(v);
    if ($("src-stats")) $("src-stats").innerHTML = srcStatsHtml(v);
    renderFooter(v);
    renderEnvironment();
  }
  function renderRuleHeader(name) {
    const v = view();
    const r = v.d.ruleBy[name];
    const el = $("rh-" + name);
    if (r && el) el.innerHTML = ruleHeadInner(v, r);
  }

  function scrollToId(id) {
    const el = $(id), b = $("body");
    if (el && b) {
      const top = el.getBoundingClientRect().top - b.getBoundingClientRect().top + b.scrollTop - b.clientHeight / 3;
      b.scrollTop = Math.max(0, top);
    }
    if (state.flash) {
      const f = $("r-" + state.flash);
      state.flash = null;
      if (f) {
        f.classList.add("flash");
        setTimeout(() => f.classList.remove("flash"), 1800);
      }
    }
  }

  function headerHtml(v) {
    const d = v.d;
    const st = d.stored || {};
    const approvals = v.approvals;
    const pill = approvals.length > 1 ? ["pill ok", approvals.length + " approvals"]
      : approvals.length === 1 ? ["pill ok", "Approved by " + (approvals[0].approver || "someone")]
      : state.approveRelayed ? ["pill", "Approval sent"] : ["pill", "Not approved"];
    const name = d.name || (v.checkMode ? "Checked ruleset" : "Unsaved ruleset");
    return (state.library !== null ? '<button class="back" data-act="back"' + tid("review-back-to-library") + ">" + ICON.back + "Library</button>" : "") +
      '<span class="hd-name" id="rs-name" title="' + esc(name) + '">' + esc(name) + "</span>" +
      (d.hash ? '<button class="hash" id="rs-hash" data-act="copy-hash" title="' + esc(d.hash) + '" aria-label="Copy ruleset hash ' +
        esc(d.hash) + '"' + tid("review-hash-copy") + "><span>" + esc(shortHash(d.hash)) + "</span>" +
        (state.copied === "hash" ? '<span class="ok">Copied</span>' : "") + ICON.copy + "</button>" : "") +
      (!v.checkMode ? '<span class="rev">rev ' + esc(st.revision_depth || 1) + "</span>" : "") +
      (v.checkMode ? '<span class="mode-tag">Check result</span>' : "") +
      '<span class="hd-br"></span>' + ENV_BADGE + relayBadge() +
      (!v.checkMode ? '<span class="' + pill[0] + '"><span class="pd"></span>' + esc(pill[1]) + "</span>" : "") + fullscreenBtn();
  }

  function tabsHtml(v) {
    const falseCount = v.res ? (v.res.tally.FALSE || 0) : 0;
    const defs = [
      ["rules", "Rules", v.res && falseCount ? falseCount + " FALSE" : String(v.d.rules.length), v.res && falseCount ? " f" : ""],
      ["source", "Source", v.dirty ? "edited" : "", v.dirty ? " e" : ""],
    ];
    if (v.unitsNeeded) defs.push(["units", "Units", v.d.unbridged.length ? String(v.d.unbridged.length) : "", ""]);
    return defs.map((t) =>
      '<button class="tab' + (v.tab === t[0] ? " on" : "") + '" role="tab" aria-selected="' + (v.tab === t[0]) +
      '" data-act="tab" data-key="' + t[0] + '"' + tid("review-tab-" + t[0]) + ">" + t[1] +
      (t[2] ? '<span class="tbg' + t[3] + '">' + esc(t[2]) + "</span>" : "") + "</button>").join("");
  }

  function bodyHtml(v) {
    if (v.tab === "source") return sourceHtml(v);
    if (v.tab === "units") return unitsHtml(v);
    return rulesToolbarHtml(v) + '<div id="rules-list">' + rulesListHtml(v) + "</div>";
  }

  // ---- the Rules tab ----------------------------------------------------------
  function ruleFilterDefs(v) {
    const d = v.d;
    const byPolicy = { neutral: 0, pessimistic: 0, optimistic: 0 };
    d.rules.forEach((r) => { byPolicy[r.policy] = (byPolicy[r.policy] || 0) + 1; });
    const defs = [["all", "All rules", d.rules.length, "all"]];
    // All three unknown policies, always, so the set reads as complete. A
    // policy no rule uses shows 0 and cannot be picked.
    ["optimistic", "neutral", "pessimistic"].forEach((k) => defs.push([k, cap(k), byPolicy[k] || 0, "policy"]));
    if (v.res) tallyOrder(v.res.tally).forEach((k) => defs.push([k, k, v.res.tally[k], "verdict"]));
    if (v.di.nRules) defs.push(["edited", "Edited", v.di.nRules, "edited"]);
    return defs;
  }
  function rulesNoteHtml(v) {
    const d = v.d;
    let text = "", cls = "note", act = false;
    const nCorrected = state.baseline
      ? d.claims.filter((c) => (state.values[c.id] || "unknown") !== (state.baseline[c.id] || "unknown")).length : 0;
    if (v.busy) text = "Checking " + plural(d.rules.length, "rule", "rules") + "…";
    else if (v.dirty) { text = "You have uncommitted edits. Results and checks use the committed hash " + shortHash(d.hash) + " until you commit."; cls = "note warn"; }
    else if (v.checkMode && v.stale) { text = "You corrected " + plural(nCorrected, "value", "values") + ". The results below are still for the values as sent."; cls = "note warn"; act = true; }
    else if (v.checkMode && !state.valuesKnown) text = "The claim values this check was sent did not reach the widget, so only each rule's result is shown.";
    else if (v.checkMode) text = "";
    else if (!v.res) text = "No check has run yet. Open a rule to answer the claims it reads, then check it. Each rule shows its own result. There is no overall verdict.";
    else if (v.stale) { text = "Claims changed after this check. These results are for the earlier values."; cls = "note warn"; act = true; }
    const undescribedCount = d.rules.filter((r) => !r.prose).length;
    let describe = "";
    const h = state.handoff;
    if (h && h.kind === "describe") describe = handoffHtml(h);
    else if (v.editable && d.hasSource && undescribedCount && !v.dirty) {
      describe = '<div class="note"><span class="grow">' + esc(plural(undescribedCount, "rule has", "rules have") + " no description yet.") +
        '</span><button class="btn sm" data-act="ask-describe"' + tid("rules-note-describe") + ">Describe them</button></div>";
    }
    const err = state.newer
      ? '<div class="note warn"><span class="grow">' + esc("A newer revision of “" + d.name + "” was saved. Loading it drops your unsaved edits.") +
        '</span><button class="btn sm" data-act="load-newer"' + tid("rules-note-load-newer") + ">Load it</button></div>"
      : "";
    if (!text) return '<div id="rules-note">' + describe + err + "</div>";
    return '<div id="rules-note" style="display:flex;flex-direction:column;gap:6px"><div class="' + cls + '"><span class="grow">' + esc(text) + "</span>" +
      (act ? '<button class="btn sm" data-act="run"' + tid("rules-note-rerun") + ">Re-run check</button>" : "") + "</div>" + describe + err + "</div>";
  }
  function rulesToolbarHtml(v) {
    const d = v.d;
    const total = d.claims.length;
    const allIds = d.claims.map((c) => c.id);
    const defs = ruleFilterDefs(v);
    const rf = defs.some((f) => f[0] === state.ruleFilter) ? state.ruleFilter : "all";
    const chips = defs.map((f, i) => {
      const empty = f[2] === 0;
      return (i > 0 && defs[i - 1][3] !== f[3] ? '<span class="chip-sep" aria-hidden="true"></span>' : "") +
        '<span class="tip-w"><button class="chip' + (rf === f[0] ? " on" : "") + (empty ? " zero" : "") +
        '" aria-pressed="' + (rf === f[0]) + '" aria-disabled="' + empty + '" aria-describedby="tip-' + f[0] +
        '" data-act="filter" data-key="' + f[0] + '"' + tid("rules-filter-chip") + ">" + esc(f[1]) + ' <span class="n">' + f[2] +
        '</span></button><span class="tip" role="tooltip" id="tip-' + f[0] + '">' + esc(FILTER_TIPS[f[0]] || "") + "</span></span>";
    }).join("");
    const active = defs.find((f) => f[0] === rf) || defs[0];
    // Touch screens have no hover, so on the phone layout the chosen filter's
    // meaning shows as a line instead.
    const fdesc = state.mobile && rf !== "all"
      ? '<p class="fdesc">' + esc((FILTER_TIPS[active[0]] || "") + " " + active[2] + " of " + d.rules.length + " rules.") + "</p>" : "";
    const setCount = d.claims.filter((c) => state.values[c.id] && state.values[c.id] !== "unknown").length;
    return '<div class="tb" id="rules-tb">' +
      (v.checkMode && v.res ? '<div class="chk-banner"><div class="chk-t">Check result: ' + esc(plural(d.rules.length, "rule", "rules")) +
        ', each with its own answer</div><div class="chk-tally">' + tallyOrder(v.res.tally).map((k) =>
          '<span class="vb lg ' + vClass(k) + (v.stale ? " stale" : "") + '">' + v.res.tally[k] + " " + esc(k) + "</span>").join("") +
        '</div><div class="chk-s">' +
        esc(state.valuesKnown ? "For the values the assistant sent. " + plural(total, "claim", "claims") + ": " + mix(allIds) + ". Open a rule to see what it read, or correct a value and re-run." : plural(d.rules.length, "rule", "rules") + " checked.") +
        "</div></div>" : "") +
      '<div class="tb-row"><label class="search">' + ICON.search + '<span class="sr">Search rules and claims</span>' +
      '<input id="rules-search" type="search" placeholder="' +
      esc(state.mobile ? "Search rules and claims" : "Search " + plural(d.rules.length, "rule", "rules") + " and " + plural(total, "claim", "claims")) +
      '" value="' + esc(state.search) + '" data-in="search"' + tid("rules-search-input") + "></label>" +
      (state.valuesKnown ? '<div class="prog-box"><span id="prog-txt">' + esc(plural(total, "claim", "claims") + ": " + mix(allIds)) + "</span></div>" : "") +
      "</div>" +
      '<div class="tb-row"><div class="chips" role="group" aria-label="Show rules">' + chips + '</div><span class="grow"></span>' +
      (setCount > 0 && !state.mobile && !v.checkMode ? '<button class="lnk" data-act="reset-all"' + tid("rules-reset-all") + ">Set all claims to unknown</button>" : "") +
      "</div>" + fdesc + rulesNoteHtml(v) + "</div>";
  }

  function keepRule(v, r, rf) {
    const q = v.q;
    if (q && !titleHit(v, r) && !claimHit(v, r)) return false;
    if (rf === "all") return true;
    if (rf === "neutral" || rf === "pessimistic" || rf === "optimistic") return r.policy === rf;
    if (rf === "edited") return !!v.di.editedRules[r.name];
    return v.verdictOf(r.name) === rf;
  }
  const titleHit = (v, r) => !v.q || r.hay.indexOf(v.q) >= 0;
  const claimHit = (v, r) => !!v.q && r.reads.some((id) => v.d.byId[id].hay.indexOf(v.q) >= 0);

  function rulesListHtml(v) {
    const d = v.d;
    const rf = ruleFilterDefs(v).some((f) => f[0] === state.ruleFilter) ? state.ruleFilter : "all";
    let shown = d.rules.filter((r) => keepRule(v, r, rf));
    // A check result leads with what went wrong: FALSE, then undecided, then
    // TRUE. The numbers keep the order the source states them.
    if (v.res) {
      const rank = { FALSE: 0, AMBIGUOUS: 1, UNKNOWN: 1, TRUE: 2 };
      const rk = (r) => { const x = v.verdictOf(r.name); return x in rank ? rank[x] : 1; };
      shown = shown.slice().sort((a, b) => (rk(a) - rk(b)) || (a.num - b.num));
    }
    if (!shown.length) return '<div class="empty">No rule or claim matches that search and filter.</div>';
    return '<div class="rules">' + shown.map((r) => ruleHtml(v, r)).join("") + "</div>";
  }

  function ruleOpen(v, r) {
    return state.ruleOpen[r.name] !== undefined ? !!state.ruleOpen[r.name] : (!titleHit(v, r) && claimHit(v, r));
  }
  function ruleHeadInner(v, r) {
    const x = v.verdictOf(r.name);
    const pol = r.policy !== "neutral" ? POLICY[r.policy] : null;
    return ICON.chev(ruleOpen(v, r)) +
      '<span class="vb ' + vClass(x) + ((v.stale || v.dirty) && x ? " stale" : "") + '">' + esc(x || "Not run") + "</span>" +
      '<span class="rule-t"><span class="rule-n"><span class="rnum">' + r.num + "</span><span>" + esc(r.title) + "</span></span></span>" +
      '<span class="rule-m"><span class="tags">' + (v.di.editedRules[r.name] ? '<span class="tag-ed">edited</span>' : "") +
      (pol ? '<span class="tip-w"><span class="pess">' + esc(r.policy) + '</span><span class="tip end" aria-hidden="true">' + esc(pol.tip) + "</span></span>" : "") +
      "</span><span>" + esc(plural(r.reads.length, "claim", "claims")) + "</span></span>";
  }
  function explain(v, r) {
    const x = v.verdictOf(r.name);
    const out = v.res ? v.res.byName[r.name] : null;
    // What the result says is about the values it was run on, which may no
    // longer be the values on screen.
    const checked = v.res ? v.res.values : state.values;
    const unknownReads = r.reads.filter((id) => (checked[id] || "unknown") === "unknown");
    const extra = [];
    if (out && out.reason_unknown) extra.push("The solver's reason: " + out.reason_unknown + ".");
    if (out && out.unbridged_units && out.unbridged_units.length) {
      extra.push("No converter from " + out.unbridged_units.map((u) => u.from + " to " + u.to).join(", ") + ".");
    }
    let text, ce = "";
    if (!x) text = v.checkMode ? "This rule was not in the check result." : "Not checked yet. Answer the claims below with Yes, No or Unknown, then check.";
    else if (x === "TRUE" && r.policy === "optimistic" && unknownReads.length) text = "TRUE. This rule is optimistic and " + plural(unknownReads.length, "claim it reads is", "claims it reads are") + " unknown; an unknown counts in its favor.";
    else if (x === "TRUE") text = "TRUE: the rule holds for the claim values in this check.";
    else if (x === "UNKNOWN") text = "UNKNOWN: a claim this rule needs was not determined." + (state.valuesKnown ? " " + plural(unknownReads.length, "claim it reads is", "claims it reads are") + " still unknown." : "");
    else if (x === "FALSE" && r.policy === "pessimistic" && unknownReads.length) text = "FALSE. This rule is pessimistic and " + plural(unknownReads.length, "claim it reads is", "claims it reads are") + " unknown; an unknown counts against it.";
    else if (x === "FALSE") {
      text = "FALSE: the rule is violated by the claim values in this check.";
      if (state.valuesKnown) {
        const setReads = r.reads.filter((id) => checked[id] && checked[id] !== "unknown");
        ce = setReads.slice(0, 10).map((id) => id + " = " + checked[id]).join(", ") +
          (setReads.length > 10 ? ", and " + (setReads.length - 10) + " more" : "");
      }
    } else if (x === "AMBIGUOUS") text = "AMBIGUOUS: the evidence for a claim this rule reads was contradicted.";
    else text = x + ": the engine's own word for this rule.";
    return { text: text + (extra.length ? " " + extra.join(" ") : ""), ce: ce };
  }

  function ruleHtml(v, r) {
    const open = ruleOpen(v, r);
    const head = '<button class="rule-h" id="rh-' + r.name + '" aria-expanded="' + open + '" data-act="rule-toggle" data-rule="' +
      r.name + '"' + tid("rule-toggle") + ">" + ruleHeadInner(v, r) + "</button>";
    if (!open) return '<div class="rule" id="r-' + r.name + '">' + head + "</div>";
    const d = v.d;
    const lines = v.di.lines;
    const blk = d.hasSource ? rangeOf(lines, r.name) : null;
    const diagsIn = (a, b) => state.diags.filter((g) => g.line >= a && g.line <= b);
    const blockDiags = blk ? diagsIn(blk[0] + 1, blk[1] + 1) : [];
    const lineNow = blk ? blk[0] + 1 : r.line;
    let prose = r.prose;
    if (state.proseBuf[r.name] !== undefined) prose = state.proseBuf[r.name];
    else if (v.dirty && blk) prose = proseAbove(lines, blk[0]).text;
    const e = explain(v, r);
    const pol = r.policy !== "neutral" ? POLICY[r.policy] : null;
    const x = v.verdictOf(r.name);
    const rows = Math.max(2, Math.ceil((prose.length || 1) / (state.mobile ? 42 : 86)) + (prose.split("\n").length - 1));
    let html = '<div class="rule-d">';
    if (d.hasSource || prose) {
      html += '<div class="prose"><label class="lbl" for="prose-' + r.name + '">What this rule says</label>' +
        (v.editable
          ? '<textarea class="prose-ed" id="prose-' + r.name + '" rows="' + rows + '" placeholder="No description yet. Say in plain words what this rule requires." data-in="prose" data-rule="' +
            r.name + '"' + tid("rule-prose-input") + ">" + esc(prose) + "</textarea>" + '<div id="rw-' + r.name + '">' + rewriteHtml(v, r, prose) + "</div>"
          : '<p class="prose-p" id="prose-' + r.name + '">' + esc(prose || "No description in the source.") + "</p>") + "</div>";
    }
    const checkLabel = v.busy ? "Checking…" : v.compiling ? "Compiling…" : v.dirty ? "Commit and check" : (x ? "Re-run check" : "Check");
    html += '<div class="res"><div class="res-t"><div class="expl">' + esc(e.text) + "</div>" +
      (e.ce ? '<div><div class="lbl" style="margin-bottom:4px">Values it read</div><div class="ce">' + esc(e.ce) + "</div></div>" : "") +
      (pol ? '<div class="expl">' + esc(pol.line) + "</div>" : "") + "</div>" +
      (v.editable && !(state.handoff && state.handoff.status === "waiting") ? '<button class="btn sm pri" data-act="rule-check" data-rule="' + r.name + '"' + (v.busy || v.compiling ? " disabled" : "") +
        tid("rule-check") + ">" + esc(checkLabel) + "</button>" : "") + "</div>";
    html += ruleClaimsHtml(v, r);
    if (v.editable && d.hasSource) {
      const srcOpen = state.srcOpen[r.name] !== undefined ? !!state.srcOpen[r.name] : blockDiags.length > 0;
      const draftSrc = blk ? lines.slice(blk[0], blk[1] + 1).join("\n") : "";
      html += '<div class="srcd"><button class="disc" aria-expanded="' + srcOpen + '" data-act="src-toggle" data-rule="' + r.name + '"' +
        tid("rule-source-toggle") + ">" + ICON.chev(srcOpen) + "<span>Rule source</span>" +
        (v.di.editedRules[r.name] ? '<span class="tag-ed">edited</span>' : "") +
        '<span class="disc-hint">' + (draftSrc ? esc(plural(draftSrc.split("\n").length, "line", "lines") + " of DSAIL") : "") + "</span></button>";
      if (srcOpen) {
        html += '<div style="display:flex;flex-direction:column;gap:6px"><div class="edit-h"><label class="lbl" for="ta-' + r.name + '">' +
          esc(r.name) + '</label><span class="hint">Written in DSAIL. Edits stay in sync with the Source tab.</span><span class="grow"></span>' +
          (v.di.editedRules[r.name] ? '<button class="lnk" data-act="rule-revert" data-rule="' + r.name + '"' + tid("rule-source-revert") + ">Revert this rule</button>" : "") +
          "</div>";
        if (!blk) {
          html += '<div class="diag">This rule is no longer in the draft. It was removed in the Source tab.</div>';
        } else {
          html += '<div class="code-box"><div class="ed ' + (state.wrap ? "wrap" : "nowrap") + '"><div aria-hidden="true" id="edl-' + r.name + '">' +
            ruleLinesHtml(v, blk, draftSrc) + '</div><textarea class="ed-ta" id="ta-' + r.name + '" spellcheck="false" autocapitalize="off" autocorrect="off" wrap="' +
            (state.wrap ? "soft" : "off") + '" data-in="rule-src" data-rule="' + r.name + '"' + tid("rule-source-input") + ">" + esc(draftSrc) + "</textarea></div></div>";
        }
        html += blockDiags.map((g) => '<div class="diag">Line ' + g.line + ": " + esc(g.message) + "</div>").join("") +
          '<div class="det-row"><button class="lnk" data-act="goto-line" data-line="' + lineNow + '"' + tid("rule-open-line") +
          ">Open at line " + lineNow + " in the Source tab</button></div></div>";
      }
      html += "</div>";
    }
    html += "</div>";
    return '<div class="rule" id="r-' + r.name + '">' + head + html + "</div>";
  }
  // A changed description is only words until the DSAIL beneath it says the
  // same thing, and writing DSAIL is the assistant's job: this hands it the
  // new description and the source to change.
  function handoffHtml(h) {
    if (h.status === "error") {
      return '<div class="note err" style="flex-direction:column;align-items:stretch"><span>' + esc(h.msg) + '</span><span class="ln" style="font-style:italic">' +
        esc(h.line) + "</span></div>";
    }
    return '<div class="handed" role="status"><kbd>Enter ↵</kbd><div><div class="big">Press Enter in the chat to send your request</div>' +
      '<div class="sub">It is waiting in your message box. The assistant then ' +
      (h.kind === "describe" ? "writes the descriptions, compiles them" : "rewrites the rule and any claims it needs, compiles it") +
      " and opens the new revision below.</div></div></div>";
  }
  function rewriteHtml(v, r, prose) {
    const h = state.handoff;
    if (h && h.kind === "rewrite" && (h.status === "error" || h.rules.indexOf(r.name) >= 0)) return handoffHtml(h);
    if ((prose || "").trim() === (r.prose || "").trim() || !(prose || "").trim()) return "";
    return '<div class="note warn"><span class="grow">The description changed. The rule still checks what its DSAIL says until the assistant rewrites it to match.</span>' +
      '<button class="btn sm pri" data-act="ask-rewrite" data-rule="' + r.name + '"' + tid("rule-prose-rewrite") + ">Update the rule to match</button></div>";
  }
  function ruleLinesHtml(v, blk, text) {
    const bad = {};
    state.diags.forEach((g) => { bad[g.line] = true; });
    return text.split("\n").map((l, i) => {
      const n = blk[0] + 1 + i;
      return '<div class="ln' + (v.di.changed[n] ? " chg" : "") + (bad[n] ? " bad" : "") + '"><span class="ln-n">' + n +
        '</span><span class="ln-t">' + highlightDSAIL(l) + "</span></div>";
    }).join("");
  }

  // A rule's claims in source order. When they come from more than one
  // section of the source ("// ---- Title ----"), each section gets a
  // collapsible header; otherwise the list is flat.
  function ruleClaimsHtml(v, r) {
    const d = v.d;
    const showAll = titleHit(v, r);
    const secs = [], bySec = {};
    let shown = 0;
    r.reads.map((id) => d.byId[id]).sort((a, b) => a.line - b.line).forEach((c) => {
      let s = bySec[c.sec];
      if (!s) { s = bySec[c.sec] = { key: c.sec, ids: [], list: [] }; secs.push(s); }
      s.ids.push(c.id);
      if (!showAll && v.q && c.hay.indexOf(v.q) < 0) return;
      s.list.push(c);
      shown++;
    });
    const multi = secs.length > 1;
    const unknownReads = r.reads.filter((id) => (state.values[id] || "unknown") === "unknown");
    const setN = r.reads.length - unknownReads.length;
    let html = '<div class="rc"><div class="rc-h"><span class="lbl">Claims it reads</span><span class="hint">' +
      esc((state.valuesKnown ? mix(r.reads) : plural(r.reads.length, "claim", "claims")) + (v.q && !showAll ? ". " + shown + " match the search" : "")) +
      '</span><span class="grow"></span>' +
      (setN > 0 && state.valuesKnown ? '<button class="lnk" data-act="reset-reads" data-rule="' + r.name + '"' + tid("rule-reads-reset") + ">Set these to unknown</button>" : "") +
      '</div><div class="rc-list">';
    if (!r.reads.length) html += '<div class="empty">This rule reads no declared claim.</div>';
    secs.filter((s) => s.list.length).forEach((s) => {
      const k = r.name + "|" + s.key;
      const open = state.rgOpen[k] !== undefined ? !!state.rgOpen[k] : (!multi || !!v.q);
      if (multi) {
        html += '<button class="rg-h" aria-expanded="' + open + '" data-act="rg-toggle" data-key="' + esc(k) + '"' + tid("rule-claims-group-toggle") + ">" +
          ICON.chev(open) + '<span class="gn">' + esc(s.key || "Other claims") + '</span><span class="grow"></span><span class="gc">' +
          esc(state.valuesKnown ? mix(s.ids) : plural(s.ids.length, "claim", "claims")) + "</span></button>";
      }
      if (open) html += s.list.map((c) => claimRowHtml(v, c, r.name)).join("");
    });
    if (r.reads.length && shown === 0) html += '<div class="empty">No claim in this rule matches the search.</div>';
    return html + "</div></div>";
  }

  function claimRowHtml(v, c, ruleName) {
    const d = v.d;
    const val = state.values[c.id] || "unknown";
    const ek = ruleName + "|" + c.id;
    const ex = !!state.expanded[ek];
    const askNow = v.dirty && (c.id in v.di.ask) ? v.di.ask[c.id] : c.q;
    const ctxNow = v.dirty ? (v.di.ctx[c.id] || "") : c.ctx;
    let lineNow = c.line;
    if (ex && v.dirty) {
      const k = v.di.lines.findIndex((l) => new RegExp("^\\s*//\\s*@ask\\s+" + reEsc(c.id) + "(?:\\s|$)").test(l));
      if (k >= 0) lineNow = k + 1;
    }
    const baseline = state.baseline;
    const corrected = !!baseline && val !== (baseline[c.id] || "unknown");
    const edited = !!v.di.editedClaims[c.id];
    const dom = "c-" + ruleName + "-" + c.id;
    let html = '<div class="crow' + (ex ? " open" : "") + '" id="' + dom + '"><div class="c-main">' +
      '<button class="c-q" aria-expanded="' + ex + '" data-act="claim-toggle" data-key="' + esc(ek) + '"' + tid("claim-toggle") + ">" +
      '<span class="c-text" id="q-' + dom + '">' + esc(askNow || c.id) + "</span>" +
      (edited || corrected ? '<span class="c-meta">' + (edited ? '<span class="tag-ed">edited</span>' : "") +
        (corrected ? '<span class="tag-cor">corrected, sent as ' + esc(valueLabel(c, baseline[c.id])) + "</span>" : "") + "</span>" : "") +
      "</button>";
    if (ex) {
      html += '<div class="c-det">';
      if (v.editable && d.hasSource) {
        html += '<label class="fld">Question, as the extractor is asked it<textarea class="inp ta" rows="3" spellcheck="true" data-in="ask" data-claim="' +
          esc(c.id) + '" data-dom="' + dom + '"' + tid("claim-ask-input") + ">" + esc(askNow) + "</textarea></label>" +
          '<label class="fld">Context for the extractor (optional)<textarea class="inp ta" rows="2" placeholder="Anything the extractor should weigh when answering" data-in="ctx" data-claim="' +
          esc(c.id) + '"' + tid("claim-context-input") + ">" + esc(ctxNow) + "</textarea></label>";
      } else if (ctxNow) {
        html += '<div class="ctx"><span class="lbl">Context for the extractor</span>' + esc(ctxNow) + "</div>";
      }
      html += state.diags.filter((g) => g.line >= lineNow && g.line <= lineNow + 1)
        .map((g) => '<div class="diag">Line ' + g.line + ": " + esc(g.message) + "</div>").join("");
      const shape = c.type === "enum" ? "One of " + (c.vocab || []).join(", ") + ", or unknown"
        : c.type === "boolean" ? "Yes, no or unknown"
        : c.type === "numeric" ? "A number" + (c.unit ? " in " + c.unit : "") + (c.range ? ", " + c.range.min + " to " + c.range.max : "") + ", or unknown"
        : "A value, or unknown";
      html += '<div class="kv sm"><span class="kv-k">Answer</span><span class="kv-v">' + esc(shape) +
        '</span><span class="kv-k">Variable</span><span class="kv-v mono">' + esc(c.id) + "</span></div>";
      const also = c.usedBy.filter((n) => n !== ruleName);
      if (also.length) {
        html += '<div class="det-row"><span class="lbl">Also read by</span>' + also.map((n) => {
          const rr = d.ruleBy[n], vv = v.verdictOf(n);
          return '<button class="chip-rule" data-act="goto-rule" data-rule="' + n + '"' + tid("claim-also-read-by") + '><span class="rnum sm">' +
            (rr ? rr.num : "") + '</span><span class="t">' + esc(rr ? rr.title : n) + "</span>" +
            (vv ? '<span class="vb sm ' + vClass(vv) + (v.stale ? " stale" : "") + '">' + esc(vv) + "</span>" : "") + "</button>";
        }).join("") + "</div>";
      }
      if (lineNow && d.hasSource && v.editable) {
        html += '<div class="det-row"><button class="lnk" data-act="goto-line" data-line="' + lineNow + '"' + tid("claim-open-line") +
          ">Open at line " + lineNow + " in the Source tab</button></div>";
      }
      html += "</div>";
    }
    html += '</div><div class="c-val">' + valueControlHtml(c, val) + "</div></div>";
    return html;
  }
  function valueControlHtml(c, val) {
    const aria = ' aria-label="Value for ' + esc(c.id) + '"';
    if (!state.valuesKnown) return '<span class="c-none">Value not shown</span>';
    if (c.type === "boolean") {
      const b = (key, label) => '<button class="seg-b' + (val === key ? " on on-" + key : "") + '" aria-pressed="' + (val === key) +
        '" data-act="val" data-claim="' + esc(c.id) + '" data-val="' + key + '"' + tid("claim-value-" + (key === "true" ? "yes" : key === "false" ? "no" : "unknown")) +
        ">" + label + "</button>";
      return '<div class="seg" role="group"' + aria + ">" + b("true", "Yes") + b("false", "No") + b("unknown", "Unknown") + "</div>";
    }
    if (c.type === "enum") {
      return '<select class="sel"' + aria + ' data-ch="enum" data-claim="' + esc(c.id) + '"' + tid("claim-value-select") + ">" +
        ["unknown"].concat(c.vocab || []).map((x) => '<option value="' + esc(x) + '"' + (val === x ? " selected" : "") + ">" + esc(cap(String(x))) + "</option>").join("") +
        "</select>";
    }
    // Empty means unknown. The unit travels with the value ("340 USD"):
    // pre-filled with the claim's declared unit, editable so a value in
    // another convertible unit can be tried.
    const unit = state.unitOf[c.id] !== undefined ? state.unitOf[c.id] : c.unit || "";
    return '<div class="numv"><input class="inp num" type="text" inputmode="decimal" placeholder="Unknown"' + aria +
      ' value="' + esc(val === "unknown" ? "" : val) + '" data-in="num" data-claim="' + esc(c.id) + '"' + tid("claim-value-number") + ">" +
