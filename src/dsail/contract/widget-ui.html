      (c.type === "numeric" ? '<input class="inp unit" type="text" placeholder="unit" aria-label="Unit for ' + esc(c.id) + '" value="' + esc(unit) +
        '" data-in="unit" data-claim="' + esc(c.id) + '" autocapitalize="off" autocorrect="off"' + tid("claim-value-unit") + ">" : "") + "</div>";
  }

  // ---- the Source tab -----------------------------------------------------------
  function srcMetaText(v) {
    return v.dirty ? plural(v.di.addedCount + v.di.removed, "line", "lines") + " changed, not committed" : "";
  }
  function srcStatsHtml(v) {
    let bytes = state.draft.length;
    try { bytes = new TextEncoder().encode(state.draft).length; } catch (e) { /* the character count stands in */ }
    const lines = v.di.lines;
    const n = lines.length > 1 && lines[lines.length - 1] === "" ? lines.length - 1 : lines.length;
    return [["Rules", fmt(v.d.rules.length)], ["Claims", fmt(v.d.claims.length)],
      ["Source", (bytes / 1024).toFixed(1).replace(/\.0$/, "") + " KB, " + fmt(n) + " lines"]]
      .map((b) => '<div class="bm"><span>' + b[0] + '</span><span class="mv">' + esc(b[1]) + "</span></div>").join("");
  }
  function sourceLinesHtml(v) {
    const bad = {};
    state.diags.forEach((g) => { bad[g.line] = true; });
    return v.di.lines.map((l, i) => {
      const n = i + 1;
      return '<div class="ln' + (state.hl === n ? " hl" : "") + (v.di.changed[n] ? " chg" : "") + (bad[n] ? " bad" : "") +
        '" id="L' + n + '"><span class="ln-n">' + n + '</span><span class="ln-t">' + highlightDSAIL(l) + "</span></div>";
    }).join("");
  }
  function sourceHtml(v) {
    if (!v.d.hasSource) {
      return '<div class="dt"><div class="note warn">This result carried no source text. Ask the assistant to load the ruleset by name to read or edit it.</div></div>';
    }
    return '<div class="tb"><div class="tb-row"><button class="tgl" aria-pressed="' + state.wrap + '" data-act="wrap"' + tid("source-wrap-toggle") + ">" +
      ICON.wrap + 'Wrap lines</button><select class="sel" aria-label="Jump to a section of the source" data-ch="jump"' + tid("source-jump-select") + ">" +
      '<option value="">Jump to…</option>' + v.d.jump.map((j) => '<option value="' + j.line + '">' + esc(j.label) + "</option>").join("") +
      (v.d.rules.length ? '<optgroup label="Rules">' + v.d.rules.map((r) => {
        const b = rangeOf(v.di.lines, r.name);
        return '<option value="' + (b ? b[0] + 1 : r.line) + '">' + r.num + ". " + esc(r.title) + "</option>";
      }).join("") + "</optgroup>" : "") +
      '</select><span class="hd-br"></span><span class="meta" id="src-meta">' + esc(srcMetaText(v)) + "</span></div>" +
      '<div class="bud" id="src-stats" aria-label="Ruleset size">' + srcStatsHtml(v) + "</div></div>" +
      '<div class="src ' + (state.wrap ? "wrap" : "nowrap") + '"><div class="ed ' + (state.wrap ? "wrap" : "nowrap") + '">' +
      '<div aria-hidden="true" id="src-lines">' + sourceLinesHtml(v) + "</div>" +
      '<label class="sr" for="source-edit">Ruleset source</label>' +
      '<textarea class="ed-ta" id="source-edit" spellcheck="false" autocapitalize="off" autocorrect="off" wrap="' + (state.wrap ? "soft" : "off") +
      '" data-in="src"' + tid("source-edit-input") + ">" + esc(state.draft) + "</textarea></div></div>";
  }

  // ---- the Units tab --------------------------------------------------------------
  function unitsHtml(v) {
    const U = state.units;
    const d = v.d;
    let body = "";
    if (U.err) body = '<div class="note err">' + esc(U.err) + "</div>";
    else if (U.relayed) body = '<p class="card-p">' + esc(HANDED + "the assistant shows this project's unit library in the chat. Converters can still be added below.") + "</p>";
    else if (!U.loaded && !canCallDirect()) {
      body = '<p class="card-p">This chat app cannot run tools from the widget. The assistant can show the library in the conversation.</p>' +
        '<div style="margin-top:10px"><button class="btn sm" data-act="units-load"' + tid("units-load") + ">Show the unit library</button></div>";
    } else if (!U.loaded) body = '<p class="card-p">Loading…</p>';
    else {
      const p = U.payload || {};
      const std = (p.standards_loaded || []).map((s) => "<span>" + esc(s.name || s.id) + "</span>").join("");
      const conv = (p.project_converters || []).map((c) =>
        "<span>1 " + esc(c.from) + " = " + esc(c.factor) + (c.offset ? " + " + esc(c.offset) : "") + " " + esc(c.to) + "</span>").join("");
      body = '<p class="card-p">' + esc(d.unbridged.length ? "Some units in this ruleset have no converter yet: " +
          d.unbridged.map((u) => (u.from || u[0]) + " to " + (u.to || u[1])).join(", ") + "." : "Every unit this ruleset uses converts. The standard library is loaded:") + "</p>" +
        '<div class="ug">' + (std || "<span>none</span>") + "</div>" +
        '<div class="lbl" style="margin-top:12px">Project converters</div><div class="ug">' + (conv || "<span>none yet</span>") + "</div>" +
        (p.note ? '<p class="card-p" style="margin-top:10px">' + esc(p.note) + "</p>" : "");
    }
    const C = state.conv;
    const fld = (key, label, ph, full) => '<label class="fld' + (full ? " full" : "") + '">' + label + '<input class="inp" placeholder="' + esc(ph) +
      '" value="' + esc(C[key]) + '" data-in="conv" data-key="' + key + '"' + (key === "factor" || key === "offset" ? ' inputmode="decimal"' : "") +
      tid("units-" + key + "-input") + "></label>";
    return '<div class="dt"><div class="card"><div class="card-h">Units<span class="card-s">' +
      esc(d.unbridged.length ? d.unbridged.length + " unbridged" : "Unit library") + "</span></div>" + body +
      '<div style="margin-top:10px"><button class="lnk" aria-expanded="' + state.addOpen + '" data-act="add-toggle"' + tid("units-add-toggle") + ">" +
      (state.addOpen ? "Hide the converter form" : "Add a project converter") + "</button></div>" +
      (state.addOpen
        ? '<p class="card-p" style="margin-top:8px">A conversion rate is a policy decision, not something to guess. Adding one changes what checks answer and invalidates any prior approval recorded against this project\'s previous unit-library hash.</p>' +
          '<div class="form">' + fld("from", "From unit", "for example, EUR") + fld("to", "To unit", "for example, USD") +
          fld("factor", "Factor (to = from × factor + offset)", "1.08") + fld("offset", "Offset", "0") +
          fld("attribution", "Attribution", "Where the factor comes from", true) +
          '<div class="full"><button class="btn sm" data-act="add-converter"' + (state.convBusy ? " disabled" : "") + tid("units-add-converter") + ">" +
          (state.convBusy ? "Adding…" : "Add converter") + "</button></div></div>" +
          (state.convErr ? '<div class="note err" style="margin-top:8px">' + esc(state.convErr) + "</div>" : "") +
          (state.convRelayed ? '<div class="note" style="margin-top:8px">' + esc(HANDED + "the assistant adds the converter and shows the updated library.") + "</div>" : "")
        : "") +
      "</div></div>";
  }

  // ---- the footer: the check and edit lifecycle ---------------------------------------
  function renderFooter(v) {
    const el = $("ft");
    if (!el) return;
    const d = v.d;
    const total = d.claims.length;
    const allIds = d.claims.map((c) => c.id);
    const res = v.res;
    let cls = "ft", ic = ICON.idle, main = "", sub = "", tally = "";
    const nCorrected = state.baseline
      ? d.claims.filter((c) => (state.values[c.id] || "unknown") !== (state.baseline[c.id] || "unknown")).length : 0;
    if (state.status === "running") {
      ic = ICON.spin; main = "Checking " + plural(d.rules.length, "rule", "rules") + "…";
      sub = "Sent " + plural(total, "claim value", "claim values") + " to dsail_check.";
    } else if (state.status === "waiting") {
      ic = ICON.spin; cls = "ft wait"; main = "Waiting on your chat app";
      sub = "It may be asking you to allow the DSAIL connector. Look for the prompt in the conversation.";
    } else if (state.status === "relayed") {
      ic = ICON.info; main = "Handed to the chat";
      sub = "This chat app cannot run tools from the widget. If the request is waiting in your message box, send it; the assistant runs the check and replies with the result.";
    } else if (state.status === "error") {
      ic = ICON.err; cls = "ft err"; main = "Check did not complete";
      sub = state.errOpen ? state.errMsg : "Nothing was evaluated. Your claim values are unchanged.";
    } else if (state.status === "stopped") {
      ic = ICON.idle; main = "Stopped waiting";
      sub = "If the chat app runs the check anyway, its result appears here.";
    } else if (state.status === "done" && res) {
      ic = ICON.done; cls = "ft done"; main = "Checked";
      tally = tallyOrder(res.tally).map((k) => '<span class="vb sm ' + vClass(k) + (v.stale ? " stale" : "") + '">' + res.tally[k] + " " + esc(k) + "</span>").join("");
      sub = v.stale ? "Claims changed since this check. Re-run to update." : "Each rule reports its own result. There is no overall verdict.";
      if (v.checkMode) {
        sub = v.stale ? plural(nCorrected, "correction", "corrections") + " to the values sent. Re-run to see their effect."
          : "Checked against " + shortHash(res.rulesetHash || d.hash) + (res.unitLibraryHash ? " and unit library " + shortHash(res.unitLibraryHash) : " and the standard unit library") +
            ". The same values always give the same result.";
      }
    } else {
      main = "Not checked yet";
      sub = !state.mobile && mix(allIds) === "all unknown"
        ? "All " + total + " claims are Unknown. Rules that depend on them will come back UNKNOWN."
        : "Claims: " + mix(allIds) + ".";
    }
    // The edit lifecycle takes over while a draft exists.
    const rev = (d.stored && d.stored.revision_depth) || 1;
    const diags = state.diags;
    if (state.commit === "compiling") {
      ic = ICON.spin; cls = "ft"; tally = "";
      main = "Compiling revision " + (rev + 1) + "…"; sub = "Sending the edited source to dsail_compile.";
    } else if (v.dirty) {
      tally = "";
      const parts = [];
      if (v.di.nRules) parts.push(plural(v.di.nRules, "rule", "rules") + " edited");
      if (v.di.nClaims) parts.push(plural(v.di.nClaims, "claim", "claims") + " reworded");
      if (!parts.length) parts.push(plural(v.di.addedCount + v.di.removed, "line", "lines") + " changed");
      if (state.commit === "error") {
        ic = ICON.err; cls = "ft err";
        main = diags.length ? "Did not compile: " + plural(diags.length, "problem", "problems") : "Did not compile";
        sub = diags.length ? "Line " + diags[0].line + ": " + diags[0].message + (diags.length > 1 ? " (and " + (diags.length - 1) + " more)" : "")
          : state.commitMsg;
      } else if (state.commit === "relayed") {
        ic = ICON.info; cls = "ft"; main = "Edit handed to the chat";
        sub = "This chat app cannot run tools from the widget. If the request is waiting in your message box, send it; the assistant compiles it and replies with the new revision.";
      } else {
        ic = ICON.draft; cls = "ft draft"; main = "Uncommitted edits: " + parts.join(", ");
        sub = state.mobile ? "Checks and approval use the committed hash until you commit."
          : "Checks and approval use the committed hash " + shortHash(d.hash) + " until you commit.";
      }
    } else if (state.commit === "done" && state.status === "idle") {
      ic = ICON.done; cls = "ft done";
      main = "Compiled revision " + rev;
      sub = state.commitMsg || ("New hash " + shortHash(d.hash) + (d.stored && d.stored.parent_hash ? ", parent " + shortHash(d.stored.parent_hash) : "") + ". Run a check against it.");
    }
    if (state.handoff && state.handoff.status === "waiting") {
      ic = ICON.enter; cls = "ft handoff"; tally = "";
      main = "Press Enter in the chat to send your request";
      sub = "It is waiting in your message box. The new revision opens below once the assistant is done.";
    }
    const btn = (act, label, extra, test) => '<button class="btn' + (extra || "") + '" data-act="' + act + '"' + tid(test) + ">" + esc(label) + "</button>";
    let acts = "";
    if (state.handoff && state.handoff.status === "waiting") {
      el.className = cls;
      el.innerHTML = '<div class="st">' + ic + '<div class="st-tx"><div class="st-m"><span>' + esc(main) + "</span></div>" +
        '<div class="st-s">' + esc(sub) + '</div></div></div><div class="acts">' + btn("handoff-cancel", "I won't send it", "", "footer-handoff-cancel") + "</div>";
      return;
    }
    if (!v.dirty && state.status === "waiting") acts += btn("stop", "Stop waiting", "", "footer-stop-waiting");
    if (!v.dirty && state.status === "done" && v.tab !== "rules" && !state.mobile) acts += btn("see-rules", "See rules", "", "footer-see-rules");
    if (!v.dirty && state.status === "error") acts += btn("err-toggle", state.errOpen ? "Hide details" : "Details", "", "footer-error-details");
    if (v.dirty && state.commit === "error" && diags.length && !state.mobile) acts += btn("show-problem", "Show problem", "", "footer-show-problem");
    if (v.dirty && state.commit !== "compiling") acts += btn("discard", "Discard", "", "footer-discard");
    if (v.dirty) {
      acts += '<button class="btn pri" data-act="commit"' + (v.compiling ? " disabled" : "") + tid("footer-commit") + ">" +
        (v.compiling ? "Compiling…" : "Commit edits") + "</button>";
    } else if (state.valuesKnown) {
      acts += '<button class="btn pri" data-act="run"' + (v.busy ? " disabled" : "") + tid("footer-run-check") + ">" +
        esc(v.busy ? "Checking…" : state.status === "error" ? "Try again" : v.res ? "Re-run check" : "Run check") + "</button>";
    }
    if (!v.dirty && !v.checkMode) {
      const approved = v.approvals.length > 0;
      acts += '<button class="btn" data-act="approve-open"' + (approved || state.approveRelayed ? " disabled" : "") + tid("footer-approve-open") + ">" +
        (approved ? "Approved" : state.approveRelayed ? "Approval sent" : "Approve…") + "</button>";
    }
    if (v.checkMode) {
      if (state.valuesKnown) acts += btn("code-open", "Use in code", "", "footer-use-in-code");
      acts += btn("open-review", "Open ruleset", "", "footer-open-ruleset");
    }
    el.className = cls;
    el.innerHTML = '<div class="st">' + ic + '<div class="st-tx"><div class="st-m"><span>' + esc(main) + "</span>" + tally + "</div>" +
      '<div class="st-s">' + esc(sub) + '</div></div></div><div class="acts">' + acts + "</div>";
  }

  // ---- overlays: approve, and use in code -----------------------------------------------
  function overlayHtml(v) {
    if (state.sheet === "approve" && !v.dirty && !v.checkMode) return approveSheetHtml(v);
    if (state.codeOpen && v.checkMode) return codeSheetHtml(v);
    return "";
  }
  function approveSheetHtml(v) {
    const d = v.d;
    const st = d.stored || {};
    const lab = d.label || {};
    const res = v.res;
    const lastCheck = !res ? "Not run in this widget. Approval does not need one."
      : tallyOrder(res.tally).map((k) => res.tally[k] + " " + k).join(", ") + (v.stale ? " (claims changed since)" : "");
    const rows = [
      ["Ruleset", d.name || "Not saved yet", ""],
      ["Hash", d.hash, " mono"],
      ["Revision", String(st.revision_depth || 1) + (st.parent_hash ? " (parent " + shortHash(st.parent_hash) + ")" : " (first revision)"), ""],
      ["Label", [lab.level_one, lab.level_two].filter(Boolean).join(" / ") || "None", ""],
      ["Asks", plural(d.claims.length, "claim", "claims"), ""],
      ["Applies", plural(d.rules.length, "rule", "rules") + ", " + d.pessCount + " pessimistic", ""],
      ["Last check here", lastCheck, ""],
    ];
    const noteMax = d.budgets.max_approval_chars || 512;
    const needName = !d.name;
    const blocked = !state.approver.trim() || (needName && !state.saveName.trim()) || state.approving;
    return '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="approve-title">' +
      '<div class="sh-h"><span class="sh-t" id="approve-title">Approve this ruleset hash</span><button class="ibtn" aria-label="Close" data-act="sheet-close"' +
      tid("approve-sheet-close") + ">" + ICON.close + "</button></div>" +
      '<div class="sh-b"><p class="card-p">Approval is recorded against these exact bytes. Any later edit produces a new hash that needs its own approval. Approving also saves the ruleset under its name.</p>' +
      '<div class="sum"><div class="kv">' + rows.map((r) => '<span class="kv-k">' + r[0] + '</span><span class="kv-v' + r[2] + '">' + esc(r[1]) + "</span>").join("") + "</div></div>" +
      (res && res.tally.FALSE > 0 && !v.stale
        ? '<div class="note warn">' + esc(plural(res.tally.FALSE, "rule", "rules") + " came back FALSE in the last check here. Approval covers the ruleset, not those claim values.") + "</div>" : "") +
      (needName
        ? '<label class="fld">Save as<input class="inp" id="save-name" placeholder="for example, expense-policy" autocapitalize="off" autocorrect="off" spellcheck="false" value="' +
          esc(state.saveName) + '" data-in="save-name"' + tid("approve-sheet-name-input") + '></label><span class="hint">Nothing names this ruleset yet. Approving saves it under this name, so you can find it again after this conversation.</span>'
        : "") +
      '<label class="fld">Approved by<input class="inp" id="approver" placeholder="Your name or email" value="' + esc(state.approver) + '" data-in="approver"' +
      tid("approve-sheet-approver-input") + "></label>" +
      '<label class="fld">Note (optional)<textarea class="inp ta" id="approve-note" maxlength="' + noteMax + '" placeholder="What you checked, or why this is approved" data-in="note"' +
      tid("approve-sheet-note-input") + ">" + esc(state.note) + '</textarea></label><span class="cnt" id="note-count">' + state.note.length + " / " + noteMax + "</span>" +
      (state.approveErr ? '<div class="note err">' + esc(state.approveErr) + "</div>" : "") +
      '</div><div class="sh-f"><button class="btn" data-act="sheet-close"' + tid("approve-sheet-cancel") + '>Cancel</button><button class="btn pri" id="approve" data-act="do-approve"' +
      (blocked ? " disabled" : "") + tid("approve-sheet-confirm") + ">" + esc(state.approving ? "Approving…" : "Approve " + d.hash.slice(0, 12)) + "</button></div></div></div>";
  }
  function codeSample(v) {
    const d = v.d;
    const wire = wireValues();
    const ids = Object.keys(wire);
    const hash = (v.res && v.res.rulesetHash) || d.hash;
    const url = state.apiUrl;
    if (state.codeLang === "python") {
      return {
        file: "claims.json", data: JSON.stringify(wire, null, 2),
        hint: "claims.json holds the " + ids.length + " values in this check.",
        // The address is written into the code whenever it is not the SDK's
        // default: a key issued here is valid only here, and a client pointed
        // elsewhere was refused and fell back to an evaluation credential that
        // cannot see this ruleset (measured 2026-09-30: RULESET_NOT_FOUND).
        // auto_credential=False makes a missing or wrong key fail as exactly
        // that, rather than as a missing ruleset.
        text: ["# pip install dsail", "# export DSAIL_CREDENTIAL=<the API key issued below>", "import json", "import dsail", ""]
          .concat([
            "client = dsail.Client(" + (url !== DEFAULT_API_URL ? 'url="' + url + '", ' : "") + "auto_credential=False)",
            'claims = json.load(open("claims.json"))', "",
            "result = client.check(", "    claims,", '    ruleset_hash="' + hash + '",', ")",
            "for assertion in result.assertions:", "    print(assertion.name, assertion.check)", "",
            "violated = result.where(dsail.FALSE)",
          ]).join("\n"),
      };
    }
    const head = ids.slice(0, 2).map((id) => '    "' + id + '": ' + JSON.stringify(wire[id]) + (ids.length > 1 ? "," : ""));
    const curl = ["curl " + url + "/v1/check \\", "  -X POST \\", '  -H "x-jaxon-credential: $DSAIL_CREDENTIAL" \\',
      '  -H "content-type: application/json" \\', "  --data @check.json"].join("\n");
    return {
      // Copy code copies the command alone; the body has its own button.
      copy: curl,
      file: "check.json", data: JSON.stringify({ ruleset_hash: hash, claims: wire }, null, 2),
      hint: "check.json is the request body: the ruleset hash and the " + ids.length + " values.",
      text: ["curl " + url + "/v1/check \\", "  -X POST \\", '  -H "x-jaxon-credential: $DSAIL_CREDENTIAL" \\',
        '  -H "content-type: application/json" \\', "  --data @check.json", "", "# check.json", "{",
        '  "ruleset_hash": "' + hash + '",', '  "claims": {']
        .concat(head, ids.length > 2 ? ["    … " + (ids.length - 2) + " more"] : [], ["  }", "}"]).join("\n"),
    };
  }
  function codeSheetHtml(v) {
    const code = codeSample(v);
    const K = state.keyStatus;
    const seg = (key, label) => '<button class="seg-b' + (state.codeLang === key ? " on" : "") + '" aria-pressed="' + (state.codeLang === key) +
      '" data-act="lang" data-key="' + key + '"' + tid("code-sheet-lang-" + key) + ">" + label + "</button>";
    let key = "";
    if (K === "idle" || K === "error") {
      key = '<p class="card-p">Code outside this chat needs an API key. A key reaches the rulesets this account holds, so a check from your code answers what a check here answers.</p>' +
        '<div class="key-row"><label class="sr" for="key-label">What the key is for</label><input class="inp" id="key-label" placeholder="What it is for, for example: case intake service" value="' +
        esc(state.keyLabel) + '" data-in="key-label"' + tid("code-sheet-key-label-input") + '><button class="btn pri" data-act="issue-key"' + tid("code-sheet-issue-key") +
        ">Issue an API key</button></div>" + (K === "error" ? '<div class="note err">' + esc(state.keyErr) + "</div>" : "");
    } else if (K === "issuing") {
      key = '<div class="note">' + ICON.spin.replace("st-ic ", "") + '<span class="grow">Issuing a key…</span></div>';
    } else if (K === "issued") {
      key = '<div class="key-row"><code class="key">' + esc(state.keyTxt) + '</code><button class="btn sm" data-act="copy-key"' + tid("code-sheet-copy-key") + ">" +
        (state.copied === "key" ? "Copied" : "Copy key") + "</button></div>" +
        '<div class="note warn"><span class="grow">Shown once. DSAIL keeps only a hash of it, so copy it now. Set it as DSAIL_CREDENTIAL where your code runs; it is sent in the x-jaxon-credential header.</span></div>';
    } else if (K === "relayed") {
      key = '<div class="note"><span class="grow">' + esc(HANDED + "the assistant issues the key, and it appears in the conversation, once. This chat app cannot run tools from the widget.") + "</span></div>";
    } else if (K === "limit") {
      key = '<div class="note warn"><span class="grow">This account has used all of its API keys. Revoke one you no longer use, then issue a new one.</span></div>';
    }
    return '<div class="scrim"><div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="code-title">' +
      '<div class="sh-h"><span class="sh-t" id="code-title">Run this check from your code</span><button class="ibtn" aria-label="Close" data-act="code-close"' +
      tid("code-sheet-close") + ">" + ICON.close + "</button></div>" +
      '<div class="sh-b"><p class="card-p">The same ruleset hash and claim values give the same result from a script or a service as they did here.</p>' +
      '<div class="seg" role="group" aria-label="Language">' + seg("python", "Python") + seg("rest", "REST") + "</div>" +
      '<pre class="code">' + esc(code.text) + "</pre>" +
      '<div class="ed-acts"><button class="btn sm" data-act="copy-code"' + tid("code-sheet-copy-code") + ">" + (state.copied === "code" ? "Copied" : "Copy code") +
      '</button><button class="btn sm" data-act="copy-data"' + tid("code-sheet-copy-data") + ">" + (state.copied === "data" ? "Copied" : "Copy " + code.file) +
      '</button><span class="hint">' + esc(code.hint) + "</span></div>" +
      '<div class="keybox"><div class="lbl">API key</div>' + key + "</div></div>" +
      '<div class="sh-f"><button class="btn" data-act="code-close"' + tid("code-sheet-done") + ">Done</button></div></div></div>";
  }

  // ---- the calls ---------------------------------------------------------------
  async function runCheck() {
    const v = view();
    if (v.busy || v.dirty || !state.d) return;
    const token = ++checkToken;
    const claims = wireValues();
    const snapValues = Object.assign({}, state.values);
    state.status = "running";
    state.errOpen = false;
    state.errMsg = "";
    if (state.commit === "done") { state.commit = null; state.commitMsg = ""; }
    render();
    clearTimeout(waitTimer);
    // Still pending after a second and a half is most often the host holding
    // the call behind a permission prompt the person has not seen yet.
    waitTimer = setTimeout(() => {
      if (token === checkToken && state.status === "running") { state.status = "waiting"; render(); }
    }, WAIT_MS);
    let outcome;
    try {
      outcome = await invoke(
        { name: "dsail_check", arguments: { ruleset_hash: state.d.hash, claims: claims } },
        relayCheck(claims)
      );
    } catch (e) {
      outcome = { error: String((e && e.message) || e) };
    }
    clearTimeout(waitTimer);
    if (token !== checkToken) return;
    if (outcome.relayed) {
      state.status = "relayed";
    } else if (outcome.error) {
      state.status = "error";
      state.errMsg = outcome.error;
    } else {
      const payload = parseResult(outcome.result);
      if (payload && payload.ok !== false && Array.isArray(payload.rules)) {
        state.result = readResult(payload, snapValues);
        state.status = "done";
      } else {
        state.status = "error";
        state.errMsg = describeError((payload && payload.error) || {}).join("; ");
      }
    }
    render();
  }

  // One commit for every edit: the draft is the single source of truth.
  async function commitDraft(thenCheck) {
    const v = view();
    if (v.compiling || !v.dirty) return;
    const d = state.d;
    const source = state.draft;
    state.commit = "compiling";
    state.diags = [];
    state.commitMsg = "";
    render();
    let outcome;
    try {
      outcome = await invoke(
        { name: "dsail_compile", arguments: { source: source, parent_hash: d.hash } },
        relayCommit(source)
      );
    } catch (e) {
      state.commit = "error";
      state.commitMsg = String((e && e.message) || e);
      render();
      return;
    }
    if (outcome.relayed) {
      // The model compiles these bytes itself, so its next conversational
      // edit is built on them: no edit is real until compile has seen it.
      state.commit = "relayed";
      render();
      return;
    }
    const payload = parseResult(outcome.result);
    if (payload && payload.ok && payload.ruleset_hash && payload.manifest) {
      await adoptCompiled(payload, d, "");
      if (thenCheck) runCheck();
      return;
    }
    const err = (payload && payload.error) || {};
    state.commit = "error";
    state.diags = (err.diagnostics || []).filter((g) => g && g.line).map((g) => ({ line: Number(g.line), message: g.message || JSON.stringify(g) }));
    state.commitMsg = describeError(err).join("; ");
    // Open every rule a problem sits in, so the error shows under its editor.
    const lines = state.draft.split("\n");
    state.d.rules.forEach((r) => {
      const b = rangeOf(lines, r.name);
      if (b && state.diags.some((g) => g.line >= b[0] + 1 && g.line <= b[1] + 1)) state.ruleOpen[r.name] = true;
    });
    render();
  }
  // A compile that succeeded becomes the widget's ruleset. A named ruleset's
  // commit is a revision OF it, so the name moves to the new revision —
  // otherwise the library keeps showing the text this edit replaced.
  // dsail_save_ruleset links the previous hash as the parent from the existing
  // binding. A ruleset with no name is left unsaved: committing is not the
  // moment to decide what something is called.
  async function adoptCompiled(payload, d, lead) {
    let stored = { parent_hash: d.hash, revision_depth: ((d.stored && d.stored.revision_depth) || 1) + 1 };
    let note = "";
    if (d.name) {
      const saved = await renameToRevision(d.name, payload.source || state.draft);
      if (saved.ok) {
        stored = { parent_hash: saved.parent_hash || d.hash, revision_depth: saved.revision_depth || stored.revision_depth };
      } else {
        note = saved.message;
      }
    }
    hydrate(Object.assign({}, payload, { name: payload.name || d.name }), {
      keepName: true, keepValues: true, stored: payload.stored || stored, commit: "done",
      commitMsg: lead ? lead + "New hash " + shortHash(payload.ruleset_hash) + ". " + note : note,
    });
    render();
  }
  async function renameToRevision(name, source) {
    try {
      const result = await quietCall({
        name: "dsail_save_ruleset",
        arguments: { name: name, source: source },
      });
      const payload = parseResult(result);
      if (payload && payload.ok) {
        libraryStale = true;
        return { ok: true, parent_hash: payload.parent_hash, revision_depth: payload.revision_depth };
      }
      // The compile stands either way — these bytes are stored and this
      // widget is about to show them. Only the library pointer did not move,
      // and saying so is better than a library that quietly disagrees.
      return { ok: false, message: "Compiled, but “" + name + "” still points at the previous revision: " +
        ((payload && payload.error && payload.error.message) || "the save was refused") + "." };
    } catch (e) {
      return { ok: false, message: "Compiled, but the library was not updated: " + String((e && e.message) || e) };
    }
  }

  // Approving SAVES. A ruleset with no name is asked for one here, and the
  // server binds it before it records the signature. Cancelling does neither —
  // no call is made until there is a name.
  async function runApproval() {
    const d = state.d;
    const approver = state.approver.trim();
    const name = d.name || state.saveName.trim();
    if (!approver || !name || state.approving) return;
    const note = state.note.trim() || null;
    state.approving = true;
    state.approveErr = "";
    render();
    try {
      const outcome = await invoke(
        { name: "dsail_record_approval", arguments: { ruleset_hash: d.hash, approver: approver, note: note, name: name } },
        relayApproval(name, approver, note)
      );
      state.approving = false;
      if (outcome.relayed) {
        // Nothing is recorded until the model makes the call; the updated
        // widget the model renders is the record.
        state.approveRelayed = true;
        state.sheet = null;
      } else {
        const payload = parseResult(outcome.result);
        if (payload && payload.ok !== false) {
          d.name = payload.name || name;
          d.approvals = payload.approvals || [{ approver: approver }];
          libraryStale = true;
          state.sheet = null;
        } else {
          // The server binds the name BEFORE recording, so a refused name
          // means nothing was saved and nothing was signed. The sheet stays
          // open on what the person typed, so they can fix it.
          state.approveErr = (payload && payload.error && payload.error.message) || "The approval was not recorded.";
        }
      }
    } catch (e) {
      state.approving = false;
      state.approveErr = String((e && e.message) || e);
    }
    render();
  }

  async function issueKey() {
    const label = state.keyLabel.trim() || null;
    state.keyStatus = "issuing";
    render();
    try {
      const outcome = await invoke({ name: "dsail_issue_api_key", arguments: { label: label } }, relayIssueKey(label));
      if (outcome.relayed) {
        state.keyStatus = "relayed";
      } else {
        const payload = parseResult(outcome.result);
        if (payload && payload.ok && payload.credential) {
          state.keyStatus = "issued";
          state.keyTxt = payload.credential;
        } else {
          const err = (payload && payload.error) || {};
          state.keyStatus = /LIMIT/.test(String(err.code || "")) ? "limit" : "error";
          state.keyErr = err.message || "No key was issued.";
        }
      }
    } catch (e) {
      state.keyStatus = "error";
      state.keyErr = String((e && e.message) || e);
    }
    render();
  }

  // Open one stored ruleset through dsail_review — the same call the model
  // makes to present a compiled one, so this opens the widget at the STORED
  // hash rather than re-compiling anything.
  async function openRuleset(hash, name) {
    const L = state.lib;
    L.opening = name || shortHash(hash);
    L.note = ""; L.noteCls = "";
    render();
    try {
      // Relayed, the row asks the model to LOAD by name — the tool that opens
      // a stored ruleset in a fresh widget — since a hash means nothing to the
      // person reading the conversation.
      const outcome = await invoke(
        { name: "dsail_review", arguments: { ruleset_hash: hash } },
        name ? relayLoad(name) : relayReview(hash)
      );
      L.opening = null;
      if (outcome.relayed) {
        L.note = HANDED + "the assistant opens “" + (name || shortHash(hash)) + "” in a new review widget.";
      } else {
        const payload = parseResult(outcome.result);
        if (payload && payload.ok && payload.manifest) {
          hydrate(payload);
        } else {
          L.note = ((payload && payload.error) || {}).message || "That ruleset could not be opened.";
          L.noteCls = "err";
        }
      }
    } catch (e) {
      L.opening = null;
      L.note = String((e && e.message) || e);
      L.noteCls = "err";
    }
    render();
  }

  async function refreshLibrary() {
    // A silent refresh is never relayed: a message the person did not ask for
    // would land in their conversation. The listing they are holding stands.
    if (!canCallDirect()) return;
    try {
      const result = await quietCall({ name: "dsail_list_rulesets", arguments: {} });
      const payload = parseResult(result);
      if (payload && payload.ok) {
        state.library = payload.rulesets || [];
        libraryStale = false;
        render();
      }
    } catch (e) {
      state.lib.note = String((e && e.message) || e);
      state.lib.noteCls = "err";
      render();
    }
  }

  async function loadUnits(relayed) {
    const U = state.units;
    if (U.loaded || U.busy) return;
    if (!relayed && !canCallDirect()) return;
    U.busy = true;
    try {
      const outcome = await invoke({ name: "dsail_unit_library", arguments: {} }, relayUnits());
      if (outcome.relayed) U.relayed = true;
      else {
        const payload = parseResult(outcome.result);
        if (payload && payload.ok === false) U.err = (payload.error && payload.error.message) || "The unit library could not be loaded.";
        else { U.payload = payload; U.loaded = true; }
      }
    } catch (e) {
      U.err = String((e && e.message) || e);
    }
    U.busy = false;
    render();
  }

  async function addConverter() {
    const C = state.conv;
    const factor = parseFloat(C.factor);
    state.convErr = "";
    state.convRelayed = false;
    if (!C.from.trim() || !C.to.trim() || !isFinite(factor) || factor === 0) {
      state.convErr = "From unit, to unit and a non-zero factor are required.";
      render();
      return;
    }
    const args = {
      from_unit: C.from.trim(), to_unit: C.to.trim(), factor: factor,
      offset: parseFloat(C.offset) || 0, attribution: C.attribution.trim() || null,
    };
    state.convBusy = true;
    render();
    try {
      const outcome = await invoke({ name: "dsail_add_unit_converter", arguments: args }, relayConverter(args));
      if (outcome.relayed) state.convRelayed = true;
      else {
        const payload = parseResult(outcome.result);
        if (payload && payload.ok !== false) {
          state.conv = { from: "", to: "", factor: "", offset: "0", attribution: "" };
          state.units = { loaded: false, payload: null, relayed: false, err: "" };
          state.convBusy = false;
          await loadUnits();
        } else {
          state.convErr = (payload && payload.error && payload.error.message) || "The converter was not added.";
        }
      }
    } catch (e) {
      state.convErr = String((e && e.message) || e);
    }
    state.convBusy = false;
    render();
  }

  // ---- following the ruleset's name --------------------------------------
  // A named ruleset can move on without this frame: the assistant saves the
  // revision a description asked for, or someone saves one elsewhere. The
  // frame watches the name for a while after it opens, and for longer after
  // it hands a request to the chat, and moves to the newest revision itself —
  // so the frame a person clicked in is the one that updates, and an older
  // frame of the same ruleset does not sit there out of date.
  const WATCH_EVERY_MS = 6000;
  const WATCH_FOR_MS = 10 * 60 * 1000;
  const WATCH_ON_OPEN_MS = 3 * 60 * 1000;
  let watchTimer = null;
  let watchUntil = 0;
  let watchBusy = false;
  function watchName(forMs) {
    watchUntil = Math.max(watchUntil, Date.now() + (forMs || WATCH_FOR_MS));
    if (!watchTimer) watchTimer = setInterval(watchTick, WATCH_EVERY_MS);
  }
  async function watchTick() {
    const d = state.d;
    if (Date.now() > watchUntil || state.view !== "review" || state.mode !== "review" || !d || !d.name || !canCallDirect()) {
      clearInterval(watchTimer);
      watchTimer = null;
      return;
    }
    if (document.hidden || watchBusy || state.commit === "compiling" || state.approving) return;
    watchBusy = true;
    try {
      const listing = parseResult(await quietCall({ name: "dsail_list_rulesets", arguments: {} }));
      const row = listing && listing.ok ? (listing.rulesets || []).find((r) => r.name === d.name) : null;
      const newer = row && row.ruleset_hash;
      if (newer && newer !== state.d.hash && !(state.newer && state.newer.ruleset_hash === newer)) {
        const payload = parseResult(await quietCall({ name: "dsail_review", arguments: { ruleset_hash: newer } }));
        if (payload && payload.ok && payload.manifest && state.d === d) adoptNewer(payload);
      }
    } catch (e) {
      console.warn("[dsail-widget] could not follow the ruleset's name", e);
    } finally {
      watchBusy = false;
    }
  }
  function adoptNewer(payload) {
    const waiting = state.handoff && state.handoff.status === "waiting";
    libraryStale = true;
    if (view().dirty && !waiting) {
      // Edits in progress are the person's; the newer revision waits for them.
      state.newer = payload;
      render();
      return;
    }
    const d = state.d;
    const rewritten = waiting && state.handoff.kind === "rewrite" ? state.handoff.rules.slice() : [];
    const rev = (payload.stored && payload.stored.revision_depth) || ((d.stored && d.stored.revision_depth) || 1) + 1;
    hydrate(payload, {
      keepName: true, keepValues: true, commit: "done",
      commitMsg: (waiting ? "Rewritten by the assistant from your description. " : "Moved to the newest revision of “" + d.name + "”. ") +
        "Revision " + rev + ", new hash " + shortHash(payload.ruleset_hash) + ".",
    });
    // Land on the change: each rewritten rule open, its new DSAIL showing.
    rewritten.forEach((name) => {
      if (!state.d.ruleBy[name]) return;
      state.ruleOpen[name] = true;
      state.srcOpen[name] = true;
    });
    if (rewritten.length && state.d.ruleBy[rewritten[0]]) state.scrollTo = "r-" + rewritten[0];
    render();
  }

  function goRule(name) {
    state.tab = "rules";
    state.ruleFilter = "all";
    state.ruleOpen[name] = true;
    state.scrollTo = "r-" + name;
    state.flash = name;
    render();
  }
  function goLine(n) {
    if (!n) return;
    state.tab = "source";
    state.hl = n;
    state.scrollTo = "L" + n;
    render();
  }

  // ---- events --------------------------------------------------------------------
  const ACTIONS = {
    "lib-open": (el) => openRuleset(el.dataset.hash, el.dataset.name),
    "lib-filter": (el) => { state.lib.filter = el.dataset.key; state.lib.shown = LIB_PAGE; render(); },
    "lib-more": () => { state.lib.shown += LIB_PAGE; render(); },
    "back": async () => {
      state.view = "library";
      render();
      if (libraryStale) await refreshLibrary();
    },
    "copy-hash": () => { if (state.d && state.d.hash) copyToClipboard(state.d.hash, "hash"); },
    "tab": (el) => {
      state.tab = el.dataset.key;
      render();
      const b = $("body");
      if (b) b.scrollTop = 0;
      if (state.tab === "units") loadUnits();
    },
    "filter": (el) => {
      if (el.getAttribute("aria-disabled") === "true") return;
      state.ruleFilter = el.dataset.key;
      render();
    },
    "reset-all": () => { state.values = blankValues(state.d); render(); },
    "rule-toggle": (el) => {
      const r = state.d.ruleBy[el.dataset.rule];
      state.ruleOpen[r.name] = !ruleOpen(view(), r);
      render();
    },
    "rule-check": () => { if (view().dirty) commitDraft(true); else runCheck(); },
    "reset-reads": (el) => { state.d.ruleBy[el.dataset.rule].reads.forEach((id) => { state.values[id] = "unknown"; }); render(); },
    "rg-toggle": (el) => {
      const k = el.dataset.key;
      state.rgOpen[k] = el.getAttribute("aria-expanded") !== "true";
      render();
    },
    "claim-toggle": (el) => { const k = el.dataset.key; state.expanded[k] = !state.expanded[k]; render(); },
    "val": (el) => { state.values[el.dataset.claim] = el.dataset.val; render(); },
    "goto-rule": (el) => goRule(el.dataset.rule),
    "goto-line": (el) => goLine(Number(el.dataset.line)),
    "src-toggle": (el) => {
      const n = el.dataset.rule;
      state.srcOpen[n] = el.getAttribute("aria-expanded") !== "true";
      render();
    },
    "rule-revert": (el) => {
      const t = state.d.blockText[el.dataset.rule];
      if (t) editRule(el.dataset.rule, t);
      delete state.proseBuf[el.dataset.rule];
      render();
    },
    "wrap": () => { state.wrap = !state.wrap; render(); },
    "stop": () => { clearTimeout(waitTimer); state.status = "stopped"; render(); },
    "see-rules": () => { state.tab = "rules"; state.ruleFilter = "all"; render(); },
    "err-toggle": () => { state.errOpen = !state.errOpen; render(); },
    "show-problem": () => { if (state.diags.length) goLine(state.diags[0].line); },
    "discard": () => { setDraft(state.d.source); state.proseBuf = {}; render(); },
    "commit": () => commitDraft(false),
    "run": () => runCheck(),
    "approve-open": () => { state.sheet = "approve"; state.approveErr = ""; render(); focusLater(state.d.name ? "approver" : "save-name"); },
    "sheet-close": () => { state.sheet = null; state.approveErr = ""; render(); },
    "do-approve": () => runApproval(),
    "code-open": () => { state.codeOpen = true; render(); },
    "code-close": () => { state.codeOpen = false; render(); },
    "lang": (el) => { state.codeLang = el.dataset.key; render(); },
    "copy-code": () => { const c = codeSample(view()); copyToClipboard(c.copy || c.text, "code"); },
    "copy-data": () => copyToClipboard(codeSample(view()).data, "data"),
    "issue-key": () => issueKey(),
    "copy-key": () => copyToClipboard(state.keyTxt, "key"),
    "open-review": () => {
      if (state.d.hasSource) {
        // The ruleset context came with the check: the same frame switches to
        // the review, keeping the values and the result.
        state.mode = "review";
        state.tab = "rules";
        state.baseline = null;
        if (state.d.name) watchName(WATCH_ON_OPEN_MS);
        render();
      } else {
        openFromCheck();
      }
    },
    "units-load": () => loadUnits(true),
    "ask-rewrite": () => handOff("rewrite"),
    "ask-describe": () => handOff("describe"),
    "handoff-cancel": () => { state.handoff = null; render(); },
    "load-newer": () => {
      const payload = state.newer;
      state.newer = null;
      if (payload) { setDraft(state.d.source); adoptNewer(payload); }
    },
    "fullscreen": async () => {
      const next = state.displayMode === "fullscreen" ? "inline" : "fullscreen";
      try {
        const answer = await app.requestDisplayMode({ mode: next });
        state.displayMode = (answer && answer.mode) || next;
      } catch (e) {
        console.warn("[dsail-widget] display mode refused", e);
      }
      render();
    },
    "add-toggle": () => { state.addOpen = !state.addOpen; render(); },
    "add-converter": () => addConverter(),
  };
  async function openFromCheck() {
    const hash = state.d.hash;
    try {
      const outcome = await invoke({ name: "dsail_review", arguments: { ruleset_hash: hash } }, relayReview(hash));
      if (outcome.relayed) { state.status = "relayed"; render(); return; }
      const payload = parseResult(outcome.result);
      if (payload && payload.ok && payload.manifest) {
        const values = state.values, result = state.result;
        hydrate(payload);
        Object.keys(state.values).forEach((id) => { if (values[id] !== undefined) state.values[id] = values[id]; });
        state.result = result;
        state.status = result ? "done" : "idle";
      } else {
        state.status = "error";
        state.errMsg = ((payload && payload.error) || {}).message || "The ruleset could not be opened.";
      }
    } catch (e) {
      state.status = "error";
      state.errMsg = String((e && e.message) || e);
    }
    render();
  }
  function focusLater(id) { requestAnimationFrame(() => { const el = $(id); if (el) el.focus(); }); }

  const INPUTS = {
    "lib-search": (el) => { state.lib.search = el.value; state.lib.shown = LIB_PAGE; renderLibrary(); },
    "search": (el) => {
      state.search = el.value;
      state.ruleOpen = {};
      state.rgOpen = {};
      $("rules-list").innerHTML = rulesListHtml(view());
    },
    "prose": (el) => {
      const name = el.dataset.rule;
      setProse(name, el.value);
      if (state.handoff) { state.handoff = null; renderFooter(view()); }
      renderChrome();
      renderRuleHeader(name);
      const rw = $("rw-" + name);
      if (rw) rw.innerHTML = rewriteHtml(view(), state.d.ruleBy[name], el.value);
    },
    "ask": (el) => {
      setAnnotation("ask", el.dataset.claim, el.value);
      const q = $("q-" + el.dataset.dom);
      if (q) q.textContent = el.value;
      renderChrome();
    },
    "ctx": (el) => { setAnnotation("context", el.dataset.claim, el.value); renderChrome(); },
    "rule-src": (el) => {
      const name = el.dataset.rule;
      editRule(name, el.value);
      const v = view();
      const blk = rangeOf(v.di.lines, name);
      const layer = $("edl-" + name);
      if (layer && blk) layer.innerHTML = ruleLinesHtml(v, blk, v.di.lines.slice(blk[0], blk[1] + 1).join("\n"));
      renderChrome();
      renderRuleHeader(name);
    },
    "src": (el) => {
      setDraft(el.value);
      const layer = $("src-lines");
      if (layer) layer.innerHTML = sourceLinesHtml(view());
      renderChrome();
    },
    "num": (el) => { state.values[el.dataset.claim] = el.value.trim() || "unknown"; renderChrome(); refreshProgress(); },
    "unit": (el) => { state.unitOf[el.dataset.claim] = el.value; },
    "approver": (el) => { state.approver = el.value; refreshApproveButton(); },
    "save-name": (el) => { state.saveName = el.value; refreshApproveButton(); },
    "note": (el) => {
      state.note = el.value;
      const c = $("note-count");
      if (c) c.textContent = state.note.length + " / " + (state.d.budgets.max_approval_chars || 512);
    },
    "key-label": (el) => { state.keyLabel = el.value; },
    "conv": (el) => { state.conv[el.dataset.key] = el.value; },
  };
  function refreshApproveButton() {
    const b = $("approve");
    if (b) b.disabled = !state.approver.trim() || (!state.d.name && !state.saveName.trim()) || state.approving;
  }
  function refreshProgress() {
    const p = $("prog-txt");
    if (p) p.textContent = plural(state.d.claims.length, "claim", "claims") + ": " + mix(state.d.claims.map((c) => c.id));
  }
  const CHANGES = {
    "lib-sort": (el) => { state.lib.sort = el.value; renderLibrary(); },
    "enum": (el) => { state.values[el.dataset.claim] = el.value; render(); },
    "jump": (el) => { const n = Number(el.value); if (n) goLine(n); },
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-in]");
    if (!el) return;
    const fn = INPUTS[el.dataset.in];
    if (fn) fn(el, e);
  });
  document.addEventListener("change", (e) => {
    const el = e.target.closest("[data-ch]");
    if (!el) return;
    const fn = CHANGES[el.dataset.ch];
    if (fn) fn(el, e);
  });
  document.addEventListener("focusout", (e) => {
    const el = e.target;
    if (el && el.dataset && el.dataset.in === "prose") delete state.proseBuf[el.dataset.rule];
  });
  // Tab inserts a tab in a source editor instead of leaving it.
  document.addEventListener("keydown", (e) => {
    const ta = e.target;
    if (e.key !== "Tab" || !ta.classList || !ta.classList.contains("ed-ta")) return;
    e.preventDefault();
    const start = ta.selectionStart, end = ta.selectionEnd;
    ta.value = ta.value.slice(0, start) + "\t" + ta.value.slice(end);
    ta.selectionStart = ta.selectionEnd = start + 1;
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  });
  window.addEventListener("resize", () => {
    if (isMobile() !== state.mobile && !document.activeElement.matches("input, textarea")) { render(); return; }
    const el = state.view === "library" ? $("library") : state.view === "review" ? $("app") : null;
    if (el) frame(el);
  });

  function showEmpty(title, sub, detail) {
    state.view = "empty";
    $("empty-msg").textContent = title;
    $("empty-sub").textContent = sub || "";
    $("empty-err").textContent = detail || "";
    $("empty-err").hidden = !detail;
    render();
  }

  function handleToolResult(result) {
    const payload = result && (result.structuredContent || parseResult(result));
    const context = checkContext(result) || contextOf(result, "dsail/save");
    // A check payload is left exactly as the service answered it, so its
    // widget block travels in the check context instead.
    if (payload && !payload.widget && context && context.widget) payload.widget = context.widget;
    // Every widget-bearing payload carries the server's say on direct calls;
    // re-read the host too, in case the frame was hydrated before the
    // handshake finished populating capabilities.
    if (payload && payload.widget && typeof payload.widget.direct_calls === "boolean") {
      host.directAllowed = payload.widget.direct_calls;
    }
    // TJP-624. `widget.environment` is present only off production; the
    // header then names the environment beside the build identifier so a
    // staged widget cannot pass for the production one. On production the
    // field is absent and nothing is shown.
    if (payload && payload.widget) {
      state.environment = typeof payload.widget.environment === "string" ? payload.widget.environment : null;
      state.build = typeof payload.widget.build === "string" ? payload.widget.build : null;
    }
    readHost();
    applyHostContext(host.ctx);
    if (payload && payload.ok && Array.isArray(payload.rulesets)) {
      state.library = payload.rulesets;
      libraryStale = false;
      state.view = "library";
      state.lib.opening = null;
      state.lib.note = "";
      render();
      return;
    }
    if (payload && payload.ruleset_hash && payload.manifest) { hydrate(payload); render(); return; }
    // A save: the frame shows the revision just saved, read back by the server.
    const saved = contextOf(result, "dsail/save");
    if (payload && payload.ok && payload.bound_at && saved) {
      if (saved.review) {
        hydrate(saved.review, { commit: "done", commitMsg: "Saved as revision " + (payload.revision_depth || 1) + " of “" + payload.name + "”, hash " + shortHash(payload.ruleset_hash) + "." });
        render();
      } else {
        showEmpty("Saved “" + payload.name + "” as revision " + (payload.revision_depth || 1) + ".", "Hash " + shortHash(payload.ruleset_hash) + ".", "");
      }
      return;
    }
    if (payload && payload.ok !== false && Array.isArray(payload.rules) && payload.ruleset_hash) {
      hydrateCheck(payload, context);
      render();
      return;
    }
    // A refused call still owns this frame. Left blank it reads as a hang, so
    // the placeholder says what the service said.
    if (payload && payload.ok === false) {
      const parts = describeError(payload.error || {});
      showEmpty(context ? "This check did not complete." : "There is nothing to show for this call.",
        "The assistant has the same message and usually corrects the call.", parts.join("\n"));
    }
  }

  // Last: registering replays whatever the host already delivered, and by
  // here every listener that a replayed render might need is attached.
  shell.ready(handleToolResult);
})();
</script>
